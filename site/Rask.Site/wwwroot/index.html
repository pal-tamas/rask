<!--
  Rask.Site — the marketing landing page, built as a Rask WASM app and served at the
  GitHub Pages root.

  This shell is the boot document, and since <RaskPrerender>true</RaskPrerender> it is also the
  TEMPLATE the prerendered page is spliced into: at publish the pass keeps this <head> — the
  fingerprinted import map, the preload, the <base href> — replaces the body below with the rendered
  page, and carries the script at the end over. So what a visitor is served has the real markup AND
  still boots. Keep it minimal; the App component is the source of truth for the page's real <head>.
-->
<!doctype html>
<!-- data-rask-ui turns the component kit's theme on for the whole document. It lives HERE, in the
     boot shell, rather than only in App.Shell: prerendering splices the render into this shell and
     this shell's opening tag is what survives, so an attribute set only in managed code never
     reaches the published page. Without it every --color-ui-* token resolves to nothing and the
     site ships structurally perfect and entirely grey. -->
<html lang="en" data-rask-ui>
<head>
    <meta charset="utf-8"/>
    <!-- <base href> is rewritten to /<prefix>/ by the framework's _RaskRewriteBaseHref target when
         published with -p:RaskPathBase=/<prefix>. This app is served from the origin root, so it is
         published without one and this default is already correct. -->
    <base href="/"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Rask</title>
    <!-- Asset-fingerprinting placeholders filled by Microsoft.NET.Sdk.WebAssembly at publish
         (<OverrideHtmlAssetPlaceholders>true</OverrideHtmlAssetPlaceholders>). -->
    <link rel="preload" id="webassembly"/>
    <script type="importmap"></script>
    <link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%237c3aed'/%3E%3Cpath d='M74 24 L38 66 L58 66 L53 104 L92 58 L70 58 Z' fill='%23fff'/%3E%3C/svg%3E"
          rel="icon" type="image/svg+xml"/>
    <style id="rask-scoped"></style>
    <style>
        /*
          The boot screen, on the light ground the page itself uses so there is no flash between the
          two. There is no theme-init script any more: this page has one palette, and the script that
          stamped data-theme existed to serve a dark default and a toggle that are both gone.

          On a published build almost nobody sees this — prerendering replaces the body below with the
          real page — so it is what `dotnet run` shows locally, and the fallback if the pass ever skips
          this route.
        */
        .rask-boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            color: #6d28d9;
            background: #fafafa;
        }

        .rask-boot .rask-spin {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid rgba(124, 58, 237, 0.25);
            border-top-color: #7c3aed;
            animation: rask-spin 0.8s linear infinite;
        }

        /* Determinate download progress, revealed by main.js once the boot config
           reports a resource count. Stays hidden (spinner-only fallback) when the
           total is unknown. */
        .rask-boot__progress {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .rask-boot__bar {
            width: 180px;
            height: 4px;
            border-radius: 999px;
            background: rgba(124, 58, 237, 0.18);
            overflow: hidden;
        }

        .rask-boot__fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: #7C3AED;
            transition: width 0.2s ease;
        }

        .rask-boot__label {
            font-size: 0.8125rem;
            opacity: 0.72;
            font-variant-numeric: tabular-nums;
        }

        @keyframes rask-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rask-pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.55;
            }
        }

        .rask-boot__label {
            font-size: 0.8125rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        @keyframes rask-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body data-rask-root>
<div class="rask-boot">
    <div class="rask-spin"></div>
    <!-- Determinate progress, revealed by main.js once the boot config reports a resource count; it
         stays hidden and the spinner alone shows when the total is unknown. It arrived with the
         showcase's shell, which is the half of the site that actually downloads a .NET runtime — the
         landing page was a single prerendered route and never needed one. One app now, so the shell
         that boots WASM has to carry it. -->
    <div class="rask-boot__progress" hidden>
        <div class="rask-boot__bar">
            <div class="rask-boot__fill"></div>
        </div>
        <div class="rask-boot__label">Loading…</div>
    </div>
</div>
<script src="main.js" type="module"></script>
<!-- PWA: register Rask's default service worker (offline app-shell cache + Web Push). It resolves
     relative to <base href>, so it works at the origin root and under a sub-path deploy. Also arrived
     with the showcase's shell; the site is a PWA and without this nothing registers the worker. -->
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            var base = document.querySelector("base");
            var scope = base ? new URL(base.href).pathname : "/";
            navigator.serviceWorker.register(scope + "rask-sw.js").catch(function () { });
        });
    }
</script>
</body>
</html>
