version: 2
updates:
  # NuGet dependencies (central package management — Directory.Packages.props)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commits so the commitlint check passes (e.g. "build(deps): bump X").
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The Roslyn compiler API consumed by the source generators (Rask.Generators,
      # Rask.Cqrs.Generators) must not exceed the compiler shipped with the build SDK — an
      # analyzer that references a newer Roslyn than the running csc fails with CS9057, and it
      # would raise the compiler floor for every downstream Rask consumer. Keep these pinned to
      # the SDK's Roslyn version; bump them by hand alongside a global.json / SDK-band update.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.JSInterop"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Playwright"
          - "coverlet.*"

  # GitHub Actions used by ci.yml / release.yml / nightly.yml / pages.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Conventional Commits so the commitlint check passes (e.g. "ci(deps): bump X").
    commit-message:
      prefix: ci
      include: scope
