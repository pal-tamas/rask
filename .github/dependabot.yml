version: 2
updates:
  # NuGet dependencies (central package management — Directory.Packages.props)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commits so the commitlint check passes (e.g. "build(deps): bump X").
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The Roslyn compiler API consumed by the source generators (Rask.Generators,
      # Rask.Batteries.Generators) must not exceed the compiler shipped with the build SDK — an
      # analyzer that references a newer Roslyn than the running csc fails with CS9057, and it
      # would raise the compiler floor for every downstream Rask consumer. Keep these pinned to
      # the SDK's Roslyn version; bump them by hand alongside an SDK-band update.
      #
      # The SDK band is stated in global.json and .github/actions/setup/action.yml (10.0.x), and in
      # rask.sh (RASK_INSTALL_DOTNET_CHANNEL); that is what "the build SDK" means here.
      #
      # .Features used to be listed here too, for a reason worth keeping in mind if it ever comes
      # back: nothing referenced it directly except the live playground, but it depends on .CSharp
      # of the same version, and central package management allows one version per package — so a
      # Features bump dragged .CSharp with it. Leaving it off the list is how PR #396 got opened
      # despite .CSharp being ignored. Dependabot must ignore must-move-together packages as a set.
      # The playground is gone and nothing references .Features any more, so it has been dropped
      # from Directory.Packages.props as well.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      #
      # MSBuild's task API — compile-only (ExcludeAssets="runtime") in the five src/*.Tasks projects,
      # with runtime assets in their test projects. 18.10 is the .NET 11 SDK line: it and its
      # exactly-pinned Microsoft.Build.Framework [18.10.1] ship lib/net11.0 + lib/net472 ONLY, where
      # 18.9.6 ships lib/net10.0. The failure mode is the dangerous one — a net10.0 project still
      # COMPILES, because it binds ref/netstandard2.0, so the build is green and only the tests that
      # load a task fail, with FileNotFoundException on Microsoft.Build.{Utilities.Core,Framework},
      # Version=15.1.0.0. That was 70 failures across the four *.Tasks.Tests projects; PR #1064 was
      # closed for it. Lift this when the repo targets net11.0, and bump both halves together.
      - dependency-name: "Microsoft.Build.Utilities.Core"
        versions: [">=18.10.0"]
    groups:
      # The .NET platform stack ships as one versioned family (10.0.x) and lands in a single
      # Directory.Packages.props — group it so a patch wave is one PR. Ungrouped members each open
      # their own PR against that one file, and those PRs then conflict pairwise.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.JSInterop"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Data.Sqlite"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Playwright"
          - "coverlet.*"
      # Two more must-move-together families, grouped for the same reason as the Roslyn pair above:
      # ungrouped, dependabot bumps one and opens a PR that leaves its partner behind.
      #
      # Spectre.Console.Testing ships doubles built against the exact matching Spectre.Console, and
      # Directory.Packages.props says to keep the two identical. SQLitePCLRaw's bundle and core are
      # one release, and are held at 3.x deliberately — ahead of what Microsoft.Data.Sqlite asks for
      # — to escape CVE-2025-6965. Splitting either pair is the failure; grouping makes it one PR.
      #
      # PackagePinFamilyTests asserts both pairs, so a split that gets through anyway fails the gate
      # rather than shipping.
      spectre-console:
        patterns:
          - "Spectre.Console*"
      sqlitepclraw:
        patterns:
          - "SQLitePCLRaw.*"

  # The front-end dependencies every `rask new --template react|preact|vue|angular|solid|svelte|lit`
  # app receives: each template's committed client/package.json and, as much, its package-lock.json —
  # the scaffolded app's first build is `npm ci`, so the lockfile IS the tree a user gets.
  #
  # ONE pull request a week for all seven, not one per template. They share most of what moves
  # (vite, typescript, eslint, prettier, tailwindcss), a pull request each would be seven that must
  # land one after another — each rebased onto the last — and a list of pull requests nobody reads is
  # how a repository ends up turning Dependabot off. Majors are a second group: a new major is the
  # one that breaks a build, and it should not hold back a week of patches while somebody reads it.
  #
  # dependabot-merge.yml merges these with nobody reading them, on ci's verdict. That verdict includes
  # the "front end <key>" job of every template the pull request changes (gates.yml, "deps":
  # "touched"): the scaffold installed from the new lockfile, built, linted and served. A red template
  # holds the whole pull request back.
  - package-ecosystem: npm
    directories:
      - "/src/Rask.Templates/*/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # The ranges in package.json are drawn by hand and TailwindVersionPinTests holds tailwindcss's
    # to the version the C# hosts download. An update inside a range moves the lockfile only; one
    # outside it (a major) widens the range.
    versioning-strategy: increase-if-necessary
    # Conventional Commits so the commitlint check passes (e.g. "build(deps): bump X").
    commit-message:
      prefix: build
      include: scope
    ignore:
      # The same hold as the site's, for the same reason: vue-tsc, svelte-check and Angular's
      # compiler all run on TypeScript's JavaScript API, which 7.x does not ship.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      template-front-ends:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      template-front-end-majors:
        patterns:
          - "*"
        update-types:
          - "major"

  # The site's own front end (src/Rask.Site/package.json + its lockfile). The island versions a
  # scaffold writes live in src/Rask.Templates/_islands/*/island.json, which is not a package.json
  # and so nothing Dependabot can read — the check-dependency-updates skill bumps those by hand.
  - package-ecosystem: npm
    directory: "/src/Rask.Site"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Conventional Commits so the commitlint check passes (e.g. "build(deps): bump X").
    commit-message:
      prefix: build
      include: scope
    ignore:
      # TypeScript 7 is the native compiler and ships no JavaScript API, which is what vue-tsc and
      # svelte-check run on: svelte-check peers typescript "^5.0.0 || ^6.0.0", so 7.x does not even
      # install (ERESOLVE on npm ci — PR #1174). Lift this when both checkers accept 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # One PR for the wave rather than one per dependency.
      site-front-end:
        patterns:
          - "*"

  # GitHub Actions used by commitlint.yml / release.yml / nightly.yml / pages.yml / upstream.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Conventional Commits so the commitlint check passes (e.g. "ci(deps): bump X").
    commit-message:
      prefix: ci
      include: scope
