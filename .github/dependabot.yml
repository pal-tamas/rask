version: 2
updates:
  # NuGet dependencies (central package management — Directory.Packages.props)
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Conventional Commits so the commitlint check passes (e.g. "build(deps): bump X").
    commit-message:
      prefix: build
      include: scope
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"
          - "Microsoft.JSInterop"
      test-tooling:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.Playwright"
          - "coverlet.*"

  # GitHub Actions used by ci.yml / release.yml / nightly.yml / pages.yml
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Conventional Commits so the commitlint check passes (e.g. "ci(deps): bump X").
    commit-message:
      prefix: ci
      include: scope
