name: nightly

# Nightly prerelease on every change to main. MinVer derives a prerelease version
# (e.g. 0.10.1-alpha.0.N after the v0.10.0 tag) for untagged commits, so packs are naturally
# prerelease on nuget.org. Stable releases (no -prerelease suffix) still come only from tagging
# via release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # update the rolling "nightly" prerelease
  packages: write   # push prerelease packages to GitHub Packages

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # Prove the opt-in full WASM AOT publish (-p:RaskWasmAot=true) stays clean end-to-end. The
  # Emscripten relink is slow, so it runs nightly only — per-PR AOT-safety is enforced by the trim +
  # AOT Roslyn analysers (IsAotCompatible / EnableAotAnalyzer) that run on every build. The build
  # is warnings-as-errors, so any RequiresDynamicCode/trim regression fails this job.
  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # shallow: publishes a sample, not a package
      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools
      - name: Restore
        run: dotnet restore samples/Rask.Example.Wasm
      - name: Publish (full WASM AOT)
        run: dotnet publish samples/Rask.Example.Wasm -c Release -p:RaskWasmAot=true --no-restore -p:MinVerSkip=true

  # Full BenchmarkDotNet timing + allocation suites. Too slow and too noisy to gate per-PR (the PR
  # `benchmarks` job in ci.yml runs only the deterministic byte gates), so the timing runs live here on
  # nightly for trend tracking. `--job short` keeps each suite to a few iterations; results are uploaded
  # as artifacts. Non-blocking: a timing wobble must not hold the nightly prerelease, so the runs are
  # best-effort (`|| true`) and the artifact is the deliverable.
  benchmarks-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7   # shallow: packs nothing
      - uses: ./.github/actions/setup   # no workloads: benchmark projects reference no WASM host
      - name: Deterministic byte + memory reports
        run: |
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -p:MinVerSkip=true -- payload-bytes
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor -p:MinVerSkip=true -- payload-bytes
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor -p:MinVerSkip=true -- mem-footprint
      # The live-session capacity reports. Absolute numbers from a shared runner mean little — these are
      # here so the CSV lands in the log and a change in SHAPE (a page size that stops scaling, a sudden
      # error count, a throughput collapse) is visible without anyone remembering to run them by hand.
      # session-load opens real sockets, so it is best-effort like the rest of this job.
      - name: Live-session capacity reports
        run: |
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -p:MinVerSkip=true -- session-footprint
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -p:MinVerSkip=true -- session-churn
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -p:MinVerSkip=true -- session-load --sessions=25 --seconds=5 || true
      - name: Full BenchmarkDotNet suites (short job)
        run: |
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -p:MinVerSkip=true -- --filter '*' --job short || true
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor -p:MinVerSkip=true -- --filter '*' --job short || true
      # The SQLite load gate: Tier 1 only (--ci), i.e. the invariants and same-run ratios that hold on any
      # hardware — a shared runner cannot be held to absolute latency. Best-effort like the rest of this job;
      # the CSV artifact is the deliverable. See LoadGate.cs for what this catches and what it does not.
      - name: SQLite load gate + report
        run: |
          mkdir -p benchmarks/Rask.Benchmarks.Sqlite/Results
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.Sqlite -p:MinVerSkip=true -- check --ci || true
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.Sqlite -p:MinVerSkip=true -- all \
            --vus 1,32,128 --duration 20 \
            --out benchmarks/Rask.Benchmarks.Sqlite/Results/sqlite-load.csv || true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            **/BenchmarkDotNet.Artifacts/**
            benchmarks/Rask.Benchmarks.Sqlite/Results/*.csv
  publish-nightly:
    needs: [aot-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Pack (prerelease)
        run: |
          dotnet pack src/Rask.Server/Rask.Server.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wasm/Rask.Wasm.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wasm.Hosting/Rask.Wasm.Hosting.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Spa.Hosting/Rask.Spa.Hosting.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Validation.DataAnnotations/Rask.Validation.DataAnnotations.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Validation.FluentValidation/Rask.Validation.FluentValidation.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Bootstrap/Rask.Bootstrap.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs/Rask.Cqrs.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs.Client/Rask.Cqrs.Client.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Query/Rask.Query.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs.Server/Rask.Cqrs.Server.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.WebPush/Rask.WebPush.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Signaling/Rask.Signaling.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite/Rask.SQLite.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.EntityFrameworkCore/Rask.SQLite.EntityFrameworkCore.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Litestream/Rask.SQLite.Litestream.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Snapshots/Rask.SQLite.Snapshots.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Browser/Rask.SQLite.Browser.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Data/Rask.Data.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Outbox/Rask.Outbox.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Jobs/Rask.Jobs.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Mail/Rask.Mail.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cache/Rask.Cache.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Logging/Rask.Logging.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Dashboard/Rask.Dashboard.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Testing/Rask.Testing.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cli/Rask.Cli.csproj -c Release -o ./artifacts

      - name: Push prerelease to nuget.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Push prerelease to GitHub Packages (mirror)
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-packages
          path: ./artifacts/*.nupkg

      - name: Update rolling "nightly" prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly ./artifacts/*.nupkg \
            --prerelease \
            --title "Nightly (${{ github.sha }})" \
            --notes "Automated prerelease from main @ ${{ github.sha }}. Not published to nuget.org."
