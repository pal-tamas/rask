name: nightly

# Nightly prerelease on every change to main. MinVer derives a prerelease version
# (e.g. 0.10.1-alpha.0.N after the v0.10.0 tag) for untagged commits, so packs are naturally
# prerelease on nuget.org. Stable releases (no -prerelease suffix) still come only from tagging
# via release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # update the rolling "nightly" prerelease
  packages: write   # push prerelease packages to GitHub Packages

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Restore
        run: dotnet restore Rask.slnx
      - name: Build (no WASM bundle)
        # -p:RaskWasm=false now genuinely skips the nested WASM publish (Rask.Wasm.Hosting.targets
        # gates _RaskPublishWasmBundle on the effective property), so the Rask.Core.dll copy race
        # against that publish can't occur here and the build runs in parallel (no -m:1).
        run: dotnet build Rask.slnx -c Release --no-restore -p:RaskWasm=false -p:WasmBuildNative=false
      - name: Unit & integration tests
        run: >-
          dotnet test Rask.slnx -c Release --no-build
          --filter "FullyQualifiedName!~Rask.Examples.E2E"

  # Prove the opt-in full WASM AOT publish (-p:RaskWasmAot=true) stays clean end-to-end. The
  # Emscripten relink is slow, so it runs nightly only — per-PR AOT-safety is enforced by the trim +
  # AOT Roslyn analysers (IsAotCompatible / EnableAotAnalyzer) that run on every build. The build
  # is warnings-as-errors, so any RequiresDynamicCode/trim regression fails this job.
  aot-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools
      - name: Restore
        run: dotnet restore samples/Rask.Example.Wasm
      - name: Publish (full WASM AOT)
        run: dotnet publish samples/Rask.Example.Wasm -c Release -p:RaskWasmAot=true --no-restore

  # Full BenchmarkDotNet timing + allocation suites. Too slow and too noisy to gate per-PR (the PR
  # `benchmarks` job in ci.yml runs only the deterministic byte gates), so the timing runs live here on
  # nightly for trend tracking. `--job short` keeps each suite to a few iterations; results are uploaded
  # as artifacts. Non-blocking: a timing wobble must not hold the nightly prerelease, so the runs are
  # best-effort (`|| true`) and the artifact is the deliverable.
  benchmarks-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Deterministic byte + memory reports
        run: |
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -- payload-bytes
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor -- payload-bytes
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor -- mem-footprint
      - name: Full BenchmarkDotNet suites (short job)
        run: |
          dotnet run -c Release --project benchmarks/Rask.Benchmarks -- --filter '*' --job short || true
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor -- --filter '*' --job short || true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: |
            **/BenchmarkDotNet.Artifacts/**

  # Browser journeys — one comprehensive journey per hosting project, sharded one host
  # per runner (mirrors ci.yml). Nightly must not publish unless every journey is green.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - ServerExampleTests
          - WasmExampleTests
          - StandaloneWasmExampleTests
          - WasmSubPathExampleTests
          - AuthExampleTests
          - JwtServerAuthExampleTests
          - WasmCookieAuthExampleTests
          - WasmJwtAuthExampleTests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        # -m:1 (serial) eliminates the parallel copy race on Rask.Core.dll (matches ci.yml).
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      - name: E2E journey (${{ matrix.host }})
        run: >-
          dotnet test tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~Rask.Examples.E2E.Tests.${{ matrix.host }}"
          --logger "trx;LogFileName=${{ matrix.host }}.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-test-results-${{ matrix.host }}
          path: |
            **/TestResults/**
            **/bin/**/test-artifacts/**

  # Rask.Native ships iOS/Android platform heads, so its prerelease package is built + packed on macOS
  # with the mobile workloads (-p:RaskNativeHeads=true) and handed to publish-nightly as an artifact.
  pack-native-nightly:
    needs: [unit, aot-publish, e2e]
    # Pinned to macos-26 (not the moving macos-latest label) so the Microsoft.iOS workload lands on the
    # matching Xcode SDK — same reason as native-ios-e2e.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install iOS + Android workloads
        run: dotnet workload install ios android

      - name: Pack Rask.Native (with iOS/Android heads)
        run: >-
          dotnet pack src/Rask.Native/Rask.Native.csproj -c Release
          -p:RaskNativeHeads=true -p:ValidateXcodeVersion=false -o ./artifacts

      - name: Upload Rask.Native package
        uses: actions/upload-artifact@v7
        with:
          name: native-nupkgs
          path: ./artifacts/Rask.Native.*.*nupkg

  publish-nightly:
    needs: [unit, aot-publish, e2e, pack-native-nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Pack (prerelease)
        # Rask.Native is packed on macOS (pack-native-nightly) because it ships iOS/Android heads this
        # Ubuntu runner can't build.
        run: |
          dotnet pack src/Rask.Server/Rask.Server.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wasm/Rask.Wasm.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wasm.Hosting/Rask.Wasm.Hosting.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Validation.DataAnnotations/Rask.Validation.DataAnnotations.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Validation.FluentValidation/Rask.Validation.FluentValidation.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Templates/Rask.Templates.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Bootstrap/Rask.Bootstrap.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs/Rask.Cqrs.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.WebPush/Rask.WebPush.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite/Rask.SQLite.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Litestream/Rask.SQLite.Litestream.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Snapshots/Rask.SQLite.Snapshots.csproj -c Release -o ./artifacts

      - name: Download Rask.Native package (macOS-built, with heads)
        uses: actions/download-artifact@v7
        with:
          name: native-nupkgs
          path: ./artifacts

      - name: Push prerelease to nuget.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Push prerelease to GitHub Packages (mirror)
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-packages
          path: ./artifacts/*.nupkg

      - name: Update rolling "nightly" prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly ./artifacts/*.nupkg \
            --prerelease \
            --title "Nightly (${{ github.sha }})" \
            --notes "Automated prerelease from main @ ${{ github.sha }}. Not published to nuget.org."
