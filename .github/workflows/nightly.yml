name: nightly

# Nightly prerelease on every change to main: 0.10.1-alpha.0.N after the v0.10.0 tag, so packs are
# naturally prerelease on nuget.org. N is NOT MinVer's height -- scripts/lib/nightly_version.py counts
# every commit the tag does not reach, which no two commits of main share (MinVer's gave a merge and the
# commit under it the same 0.23.1-alpha.0.526, 2026-10-26). Stable releases (no -prerelease suffix)
# still come only from tagging via release.yml.
#
# EARLY: it starts when main's push run of ci STARTS, packs the commit while that run builds it, and pushes
# as soon as the run's `build` job (the build and the unit tests) is green — GitHub Packages first, usable
# within seconds, then nuget.org, which validates for five to twenty-five minutes. Browser E2E, templates and
# the CLI build may still be running, and a red one there is fixed forward by the next push. Until
# 2026-11-03 it waited for the whole run, and before that for full.yml. Restore at 1.0: follow the whole run
# of full.yml again (docs/development-workflow.md, "Loosened until 1.0"). scripts/lib/nightly_pick.sh says
# which commit, and why; the completed run and the hourly schedule are the backstop for an early nightly
# that never came or did not finish. workflow_dispatch publishes whatever main holds, verdict or not.
on:
  workflow_run:
    workflows: [ci]
    types: [requested, completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # hourly, off the hour
  workflow_dispatch:

# The run list shows main's head otherwise -- not the commit a nightly packs.
run-name: >-
  ${{ github.event_name == 'workflow_run'
      && format('nightly {0} ({1} {2})', github.event.workflow_run.head_sha, github.event.workflow_run.event, github.event.action)
      || format('nightly ({0})', github.event_name) }}

permissions:
  contents: read

# No run-wide group: each stage has its own (below). A newer commit's `prepare` cancels an older one that
# is still packing or waiting for its build -- it has pushed nothing, and the newer one supersedes it. A
# push in progress always finishes (half a version's packages is worse than a late one); a push waiting
# behind it is replaced by a newer one. The verify-and-release stage of an older version is cancelled by a
# newer one's: the newer release is the one that counts.
jobs:
  pick:
    # A completed run is a backstop only when it passed; a failed one published early if its build passed.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.action == 'requested'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read    # main's ci runs and their jobs; the other nightly runs
      contents: read   # the release the last nightly left
    outputs:
      sha: ${{ steps.find.outputs.sha }}
      run: ${{ steps.find.outputs.run }}
      wait: ${{ steps.find.outputs.wait }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/lib

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_RUN: ${{ github.event.workflow_run.id }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
        run: scripts/lib/nightly_pick.sh

  # Pack, then wait for the build: the pack takes about five minutes, the build longer, so the two overlap.
  prepare:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 90   # the pack, then up to an hour for the build (scripts/lib/nightly_wait.sh)
    concurrency:
      group: nightly-prepare
      cancel-in-progress: true
    permissions:
      actions: read    # the ci run's build job
      contents: read
    env:
      SHA: ${{ needs.pick.outputs.sha }}
    outputs:
      version: ${{ steps.pack.outputs.version }}
      # Packed, and (early) its build passed. A skipped wait -- a backstop or a manual run -- leaves it to the pack.
      go: ${{ steps.pack.outcome == 'success' && (steps.wait.outputs.go || 'true') || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0   # the version counts the history

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      # The scripts as of THIS workflow file, which is main's -- the tree above is the commit being packed,
      # which can be older than them. Read out of the history the checkout already holds, so nothing lands
      # in the tree being packed.
      - name: Main's scripts
        run: |
          mkdir -p "$RUNNER_TEMP/publisher"
          git archive "$GITHUB_SHA" scripts/lib | tar -x -C "$RUNNER_TEMP/publisher"

      # Early, the pack runs ahead of ci's verdict, so a commit that does not compile fails it too: that is
      # ci's to report. It is this run's failure only when the build then passes (the last step).
      - id: pack
        continue-on-error: ${{ needs.pick.outputs.wait == 'true' }}
        run: '"$RUNNER_TEMP/publisher/scripts/lib/nightly_pack.sh" ./artifacts'

      # Before the push, so a publish that fails still leaves the packages it was pushing on the run.
      - if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error

      - id: wait
        if: needs.pick.outputs.wait == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ needs.pick.outputs.run }}
        run: '"$RUNNER_TEMP/publisher/scripts/lib/nightly_wait.sh" "$RUN"'

      - name: A pack that failed where the build passed
        if: steps.pack.outcome == 'failure' && steps.wait.outputs.go == 'true'
        run: |
          echo "::error::ci's build passed for $SHA, but the pack failed (see the pack step above): nothing was published."
          exit 1

  push:
    needs: [pick, prepare]
    if: needs.prepare.outputs.go == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 60   # pushes only; a hung one must end, or the next nightly's push waits forever
    concurrency:
      group: nightly-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # GitHub Packages
      id-token: write   # nuget.org trusted publishing: the job's OIDC token buys a one-hour key, no stored secret
    env:
      SHA: ${{ needs.pick.outputs.sha }}
    steps:
      # The packed commit's src/ (the script checks the set against its packable projects) ...
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # ... and the publish script as of THIS workflow file, which is main's.
      - uses: actions/checkout@v7
        with:
          path: .publisher
          sparse-checkout: scripts/lib

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nightly-packages
          path: ./artifacts

      # FIRST: GitHub Packages serves a package the moment it is pushed — no validation — so this is the
      # feed the peer apps restore a nightly from minutes after the push (docs/installation.md, "Nightly
      # builds"). Same one wave as nuget.org below; --skip-duplicate makes a re-run finish what is missing.
      - name: Push prerelease to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 .publisher/scripts/lib/publish_packages.py push ./artifacts
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key-env GITHUB_PACKAGES_TOKEN
          --waves 1
          --jobs 8
          --projects src
          --commit "$SHA"

      # ONE wave: every package at once, eight pushes at a time, each retried; nothing waits for nuget.org
      # until the verify in `release`. Level by level, the gate waited for validation eight times over
      # (~6.5 min each, most of a nightly's three hours); release.yml still does. The price: for as long as
      # validation takes, or until a re-run finishes a failed push, a package can be served ahead of a
      # dependency (2026-10-12: Rask.Server was, for every app floating `0.*-*`). Restore at 1.0: drop
      # --waves/--jobs (docs/development-workflow.md, "Loosened until 1.0").
      # --gate-index stays for the check before the first push: a version nuget.org already serves from
      # ANOTHER commit is refused (exit 3) — a version is one commit's.
      # No key is stored: nuget.org's trusted publishing policy for pal-tamas names this repository and
      # nightly.yml, and the script trades the job's OIDC token for a one-hour key.
      - name: Push prerelease to nuget.org, all at once
        run: >-
          python3 .publisher/scripts/lib/publish_packages.py push ./artifacts
          --source https://api.nuget.org/v3/index.json
          --trusted-publisher pal-tamas
          --gate-index nuget.org
          --waves 1
          --jobs 8
          --projects src
          --commit "$SHA"

  # Not done until nuget.org serves every package of the version, each THIS commit's; only then does the
  # rolling release move -- `pick` reads it to know what is published, so a publish that failed above is
  # tried again by the next run.
  release:
    needs: [pick, prepare, push]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    permissions:
      contents: write   # the rolling "nightly" prerelease
    env:
      SHA: ${{ needs.pick.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # nightly_anchor.sh walks the packed commit's history

      - uses: actions/download-artifact@v8
        with:
          name: nightly-packages
          path: ./artifacts

      - name: Wait until nuget.org serves the whole version
        run: python3 scripts/lib/publish_packages.py verify ./artifacts

      # The tag goes where the workflow token may put it (scripts/lib/nightly_anchor.sh: GitHub refuses it a
      # ref on a commit that changes a workflow -- nightly 41608821292, 2026-11-03); the title names the
      # commit packed either way. Created before the old one is deleted would be a second release on one tag,
      # so the delete comes first -- and a create that fails leaves no release, which `pick` reads as
      # "publish again".
      - name: Update rolling "nightly" prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          anchor="$(scripts/lib/nightly_anchor.sh "$SHA")"
          anchor="${anchor:-$SHA}"
          notes="Automated prerelease $VERSION, packed from main @ $SHA and published to GitHub Packages and nuget.org."
          [ "$anchor" = "$SHA" ] || notes="$notes The \`nightly\` tag is on $anchor, the newest commit under it that changes no workflow: GitHub does not let a workflow tag a commit that does."
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly ./artifacts/*.nupkg \
            --prerelease \
            --target "$anchor" \
            --title "Nightly $VERSION ($SHA)" \
            --notes "$notes"
