name: nightly

# Nightly prerelease on every change to main: 0.10.1-alpha.0.N after the v0.10.0 tag, so packs are
# naturally prerelease on nuget.org. N is NOT MinVer's height -- scripts/lib/nightly_version.py counts
# every commit the tag does not reach, which no two commits of main share (MinVer's gave a merge and the
# commit under it the same 0.23.1-alpha.0.526, 2026-10-26). Stable releases (no -prerelease suffix)
# still come only from tagging via release.yml.
#
# Runs AFTER main's ci run — the gates a push could reach, scoped (ci.yml) — and packs the newest commit
# such a run passed, once. Until 2026-11-03 it followed full.yml, the whole push set, which ran a second
# time behind every push; main now runs once. Restore at 1.0: follow full.yml again
# (docs/development-workflow.md, "Loosened until 1.0"). It follows a run and not a clock: Actions started
# the hourly schedule this used to wait for every four to seven hours (2026-10-08/09), which is how long a
# fix sat green and unpublished. The schedule stays as the backstop for a completion event that never arrives.
# workflow_dispatch publishes whatever main holds, verdict or not.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'   # hourly, off the hour
  workflow_dispatch:

permissions:
  contents: write   # update the rolling "nightly" prerelease
  packages: write   # push prerelease packages to GitHub Packages

concurrency:
  group: nightly
  cancel-in-progress: false   # a publish in progress finishes: half a version's packages is worse than a late one

jobs:
  # The commit to publish: the newest one main's ci passed on a push, unless the rolling "nightly" release
  # was already cut from it. Empty publishes nothing. A completed pull request or manual ci run is no
  # verdict on main: a manual one may have been narrowed to a single gate.
  pick:
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-26.04
    permissions:
      actions: read    # the last green ci run on main
      contents: read   # the release the last nightly left
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # Run by hand from another branch -- a ci/** one, say -- it would publish that branch's head.
            say="Nothing published: a nightly is packed from main only, and this run was dispatched on \`$GITHUB_REF\`."
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            sha="$GITHUB_SHA"
            say="Publishing \`$sha\` by hand: no ci run was asked about it."
          else
            # The same question on a schedule and on a completed ci run: neither publishes a commit no
            # push run of ci passed on main. A run that passed on a re-run counts.
            read -r green run <<< "$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0] | "\(.head_sha) \(.html_url)"' 2>/dev/null || true)"
            published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" \
              --jq '.target_commitish // empty' 2>/dev/null || true)"
            if [ -z "$green" ] || [ "$green" = "null" ]; then
              green=""; say="Nothing published: no ci run has passed on main."
            elif [ "$green" = "$published" ]; then
              say="Nothing published: \`$green\` is the newest commit ci passed on main ($run), and the last nightly is already cut from it."
            else
              sha="$green"
              say="Publishing \`$green\`, which ci passed on main: $run (the last nightly is ${published:-none})."
            fi
          fi
          # On the run page, because the run list shows main's head -- not the commit that is packed,
          # and not whether anything was.
          echo "$say" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  publish-nightly:
    needs: pick
    if: needs.pick.outputs.sha != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 180   # a publish that hangs must end, or `nightly` (one at a time) never runs again
    permissions:
      contents: write   # update the rolling "nightly" prerelease
      packages: write   # push prerelease packages to GitHub Packages
      id-token: write   # nuget.org trusted publishing: the job's OIDC token buys a one-hour key, no stored secret
    env:
      SHA: ${{ needs.pick.outputs.sha }}   # the commit main's ci passed
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      # The version, from main's script (this workflow's commit) read out of the history the checkout
      # already holds, so nothing lands in the tree being packed. MinVer's own height can repeat across a
      # merge that lands a worktree branch; this one is distinct for every commit of main, and only grows.
      # A re-run packs the same commit, so it is the same version, and the publish resumes.
      - name: Version
        id: version
        run: |
          git show "$GITHUB_SHA:scripts/lib/nightly_version.py" > "$RUNNER_TEMP/nightly_version.py"
          version="$(python3 -I "$RUNNER_TEMP/nightly_version.py" . --commit "$SHA")"
          echo "Packing \`$SHA\` as **$version**." | tee -a "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # ONE pack, for the whole solution -- see release.yml for why the hand-written list went.
      # Keeping the two in step by hand is what let 16 projects reach nightly and never reach a stable
      # release (#1044); neither has a list now, so neither can drift from the other.
      # MinVerVersionOverride stamps the package AND assembly versions, as MinVer would have.
      - name: Pack (prerelease)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet pack Rask.slnx -c Release -o ./artifacts -p:MinVerVersionOverride="$VERSION"

      # Before the push, so a publish that fails still leaves the packages it was pushing on the run.
      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-packages
          path: ./artifacts/*.nupkg

      # The publish script as of THIS workflow file, which is main's -- the tree above is the commit
      # being packed, which can be older than the script's arguments. After the pack on purpose.
      - uses: actions/checkout@v7
        with:
          path: .publisher
          sparse-checkout: scripts/lib

      # Dependencies first, and a package only once nuget.org SERVES what it depends on -- so whatever
      # stops this step, nothing is listed ahead of its dependencies (2026-10-12: Rask.Server was, for
      # every app floating `0.*-*`). Each push is retried; a re-run of this job packs the same commit,
      # so it gets the same version and --skip-duplicate picks up where it stopped.
      # Before the first push, a version nuget.org already serves from ANOTHER commit is refused (exit 3),
      # and each gate refuses one that turns up mid-publish: a version is one commit's.
      # The gate is the slow part: nuget.org validates for minutes and the set is eight levels deep.
      # Drop --gate-index to push without waiting, at the price of a package being served before a
      # dependency of it for as long as validation happens to take.
      # No key is stored: nuget.org's trusted publishing policy for pal-tamas names this repository and
      # nightly.yml, and the script trades the job's OIDC token for a one-hour key, again before a level
      # when the one in hand has aged (the gate makes a publish longer than an hour).
      - name: Push prerelease to nuget.org, dependencies first
        id: push
        run: >-
          python3 .publisher/scripts/lib/publish_packages.py push ./artifacts
          --source https://api.nuget.org/v3/index.json
          --trusted-publisher pal-tamas
          --gate-index nuget.org
          --projects src
          --commit "$SHA"

      # Not done until every package of the version can be restored, and every one served is THIS commit's
      # (its nuspec's <repository commit>) -- listed alone passed .526 with packages from two commits.
      # The summary on the run page names the version and the commit: the run list shows main's head.
      - name: Wait until nuget.org serves the whole version
        run: python3 .publisher/scripts/lib/publish_packages.py verify ./artifacts

      - name: Push prerelease to GitHub Packages (mirror)
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python3 .publisher/scripts/lib/publish_packages.py push ./artifacts
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key-env GITHUB_PACKAGES_TOKEN

      # Last, and only after the version is whole: `pick` reads this release to know what is published,
      # so a publish that failed above is tried again by the next run.
      - name: Update rolling "nightly" prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.push.outputs.version }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly ./artifacts/*.nupkg \
            --prerelease \
            --target "$SHA" \
            --title "Nightly $VERSION ($SHA)" \
            --notes "Automated prerelease $VERSION, packed from main @ $SHA and published to nuget.org."
