name: nightly

# Nightly prerelease on every change to main. MinVer derives a prerelease version
# (e.g. 0.10.1-alpha.0.N after the v0.10.0 tag) for untagged commits, so packs are naturally
# prerelease on nuget.org. Stable releases (no -prerelease suffix) still come only from tagging
# via release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # update the rolling "nightly" prerelease
  packages: write   # push prerelease packages to GitHub Packages

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  publish-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Pack (prerelease)
        run: |
          dotnet pack src/Rask/Rask.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Server/Rask.Server.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wasm/Rask.Wasm.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wasm.Hosting/Rask.Wasm.Hosting.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Spa.Hosting/Rask.Spa.Hosting.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Validation.DataAnnotations/Rask.Validation.DataAnnotations.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Validation.FluentValidation/Rask.Validation.FluentValidation.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Blazor/Rask.Blazor.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.External/Rask.External.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Wire/Rask.Wire.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Api/Rask.Api.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Api.Client/Rask.Api.Client.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs/Rask.Cqrs.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs.Client/Rask.Cqrs.Client.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Query/Rask.Query.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cqrs.Server/Rask.Cqrs.Server.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.WebPush/Rask.WebPush.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Signaling/Rask.Signaling.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite/Rask.SQLite.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.EntityFrameworkCore/Rask.SQLite.EntityFrameworkCore.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Litestream/Rask.SQLite.Litestream.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Snapshots/Rask.SQLite.Snapshots.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.SQLite.Browser/Rask.SQLite.Browser.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Data/Rask.Data.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Outbox/Rask.Outbox.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Jobs/Rask.Jobs.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Mail/Rask.Mail.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cache/Rask.Cache.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Logging/Rask.Logging.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Dashboard/Rask.Dashboard.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Testing/Rask.Testing.csproj -c Release -o ./artifacts
          dotnet pack src/Rask.Cli/Rask.Cli.csproj -c Release -o ./artifacts

      - name: Push prerelease to nuget.org
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Push prerelease to GitHub Packages (mirror)
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: nightly-packages
          path: ./artifacts/*.nupkg

      - name: Update rolling "nightly" prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly ./artifacts/*.nupkg \
            --prerelease \
            --title "Nightly (${{ github.sha }})" \
            --notes "Automated prerelease from main @ ${{ github.sha }}. Not published to nuget.org."
