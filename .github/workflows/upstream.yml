name: upstream

# Follows everything Rask is generated from, every day, with nobody watching.
#
#   follow   a job per follower (scripts/upstream/follow.sh --list), each a call of upstream-follow.yml:
#            regenerate, gate what that commit can reach, land it, and keep that source's own issue — so
#            one release the gates refuse holds back its source only. The followers: MDN's latest stable
#            data and the public surface that moves with it, Node's Active LTS line, the Docker images the
#            code names, Litestream, Chrome for Testing, the compilers a build downloads with their digests,
#            the adapter fixtures' frameworks, the actions a scaffolded deploy workflow uses, the npm
#            releases `rask new` falls back on offline, and Unicode CLDR's date-time joins.
#            Nothing moved: that job ends green. Dependabot keeps the rest (.github/dependabot.yml).
#   flux     scripts/flux/sync.mjs — has Flux UI's catalogue, look or release moved? A look is pixels,
#            so the lock is measured HERE, on the runner: `-f relock=true` (or a lock from another
#            platform, or taken by measuring code that has changed since) re-measures every look and
#            lands the lock instead of reporting them.
#   front-ends  every front-end template scaffolded on the newest npm set `rask new` chooses, installed,
#            built, linted and served — the templates pin nothing, so this is where a release that breaks
#            a starter is caught.
#
# Every source keeps ONE issue, opened only when a person is needed and closed by its next green run.
# A follower the gates refused for a red main already has waits instead (upstream-waits/<follower>): when
# full.yml next passes on main, this workflow runs again for the waiting followers alone.
#
# Unlike a hand push, this is gated BEFORE it lands: a red main waits for whoever pushed it, and
# nobody pushed this.
on:
  schedule:
    - cron: '41 3 * * *'   # daily, off the hour (the top of the hour is when Actions queues)
  workflow_run:
    workflows: [full]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      relock:
        description: Rask.Ui matches Flux UI again — lock every look as the runner measures it now
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  # Daily, every follower. After a green full.yml, only those waiting for main — usually none, and the
  # run ends here.
  followers:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_run ]; then
            names="$(git ls-remote --heads origin 'refs/heads/upstream-waits/*' | sed 's|.*refs/heads/upstream-waits/||')"
          else
            names="$(scripts/upstream/follow.sh --list)"
          fi
          echo "names=$(printf '%s' "$names" | jq -Rnc '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  follow:
    needs: followers
    if: needs.followers.outputs.names != '[]'
    name: ${{ matrix.follower }}
    strategy:
      fail-fast: false   # one source the gates refuse says nothing about the others
      max-parallel: 4
      matrix:
        follower: ${{ fromJSON(needs.followers.outputs.names) }}
    permissions:
      contents: write
      actions: write
      issues: write
    uses: ./.github/workflows/upstream-follow.yml
    with:
      follower: ${{ matrix.follower }}

  flux:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # main, for the lock a baseline measured
      issues: write
    env:
      LOCK: tests/Rask.Ui.Tests/Flux/flux.lock.json
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: Flux UI moved past the Rask.Ui that matches it
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # The scripts take any Playwright driver (RASK_FLUX_PLAYWRIGHT); the one the E2E project
      # carries would cost a build of the whole site to get at. The same release line as that one
      # (Microsoft.Playwright in Directory.Packages.props, which Dependabot moves): a new Chromium is a
      # relock, so it arrives with that bump rather than on its own.
      - name: Chromium
        run: |
          set -eu
          line="$(sed -n 's/.*Include="Microsoft.Playwright" Version="\([0-9]*\.[0-9]*\)\..*/\1/p' Directory.Packages.props)"
          [ -n "$line" ] || { echo "no Microsoft.Playwright in Directory.Packages.props" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/playwright" && cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --silent --no-audit --no-fund "playwright@$line"
          npx playwright install --with-deps chromium
          echo "RASK_FLUX_PLAYWRIGHT=$RUNNER_TEMP/playwright/node_modules/playwright" >> "$GITHUB_ENV"

      - name: Has Flux UI moved?
        id: sync
        env:
          RELOCK: ${{ inputs.relock }}
        run: |
          set -u
          mode=()
          if [ "$RELOCK" = "true" ] || ! node scripts/flux/sync.mjs --comparable; then
            mode=(--baseline)
            echo "baselined=true" >> "$GITHUB_OUTPUT"
          fi

          node scripts/flux/sync.mjs "${mode[@]}" | tee "$RUNNER_TEMP/flux.log"
          case "${PIPESTATUS[0]}" in
            0) echo "moved=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "moved=true"  >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      # No test reads the lock, so it lands ungated like nothing else the bot writes. The snapshot stays
      # behind: FluxConformanceTests read it, so a catalogue move is reported and waits for a person.
      - name: Land the baselined lock
        if: steps.sync.outputs.baselined == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          if git diff --quiet -- "$LOCK"; then
            echo "The lock already holds what this runner measures."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(ui): baseline the Flux lock on linux" -- "$LOCK"
          git reset -q --hard
          git fetch -q origin main
          git rebase -q origin/main
          git push -q origin HEAD:main

      - name: Flux UI moved
        if: steps.sync.outputs.moved == 'true' && github.ref == 'refs/heads/main'
        run: |
          set -eu
          {
            echo "Flux UI is no longer where Rask.Ui last matched it ($RUN):"
            echo
            echo '```'
            sed -n '/flux sync: Flux moved/,$p' "$RUNNER_TEMP/flux.log"
            echo '```'
            echo
            echo "Match the components named above (\`flux-component\` skill: \`FluxConformanceTests\` names the"
            echo "props, \`parity.mjs <slug>\` the pixels), then \`gh workflow run upstream.yml -f relock=true\`."
            echo "The lock is measured on the runner, so a local \`sync.mjs\` measures but does not compare."
            echo
            echo "<sub>Opened by \`.github/workflows/upstream.yml\`, which updates this issue rather than opening another, and closes it when Flux and Rask.Ui match again.</sub>"
          } > "$RUNNER_TEMP/body.md"
          scripts/upstream/issue.sh "$TITLE" "$RUNNER_TEMP/body.md"

      - name: Flux UI matches
        if: steps.sync.outputs.moved == 'false' && github.ref == 'refs/heads/main'
        run: |
          scripts/upstream/issue.sh --close "$TITLE" "Rask.Ui matches Flux UI again: $RUN"

      - name: Flux UI could not be measured
        if: failure() && github.ref == 'refs/heads/main'
        run: |
          printf '%s\n\n%s\n' "The Flux job could not tell whether Flux UI moved: $RUN" \
            "<sub>Opened by \`.github/workflows/upstream.yml\`, and closed by its next run that can tell.</sub>" > "$RUNNER_TEMP/body.md"
          scripts/upstream/issue.sh "Upstream: flux could not be followed" "$RUNNER_TEMP/body.md"

      - name: Flux UI measured
        if: success() && github.ref == 'refs/heads/main'
        run: |
          scripts/upstream/issue.sh --close "Upstream: flux could not be followed" "Measured again: $RUN"

  # The templates name no version: `rask new` chooses the newest set that installs together, so what npm
  # released overnight is what the next scaffold gets. This proves that set, on main as it is, every day —
  # scaffolded, installed from the live registry, built, linted and served — rather than when a template changes.
  front-end-keys:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-26.04
    outputs:
      keys: ${{ steps.list.outputs.keys }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: echo "keys=$(scripts/run-template-e2e.sh --list-front-ends | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  front-ends:
    needs: front-end-keys
    name: front end ${{ matrix.key }} (newest npm)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false   # one template that no longer installs says nothing about the others
      matrix:
        key: ${{ fromJSON(needs.front-end-keys.outputs.keys) }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      TITLE: "Upstream: front end ${{ matrix.key }} no longer builds on the newest npm"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer packs the local feed the scaffold restores from

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: front end ${{ matrix.key }}
        env:
          RASK_BUILD_SLOTS: 4
        run: scripts/run-template-e2e.sh --front-end=${{ matrix.key }}

      - name: The starter broke
        if: failure() && github.ref == 'refs/heads/main'
        env:
          KEY: ${{ matrix.key }}
        run: |
          set -eu
          {
            echo "The \`$KEY\` template no longer builds on the newest npm packages \`rask new\` chooses: $RUN"
            echo
            echo "A release upstream broke the starter, and every scaffold from today gets it. Fix the starter for"
            echo "the new release, or — only when that cannot be done yet — hold the package with a range in its"
            echo "template (and in TemplateNodePinTests' holds), with the reason beside it."
            echo
            echo "<sub>Opened by \`.github/workflows/upstream.yml\`, which updates this issue rather than opening another, and closes it when the template builds again.</sub>"
          } > "$RUNNER_TEMP/body.md"
          scripts/upstream/issue.sh "$TITLE" "$RUNNER_TEMP/body.md"

      - name: The starter builds
        if: success() && github.ref == 'refs/heads/main'
        run: |
          scripts/upstream/issue.sh --close "$TITLE" "Builds again on the newest npm: $RUN"
