name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish Rask.Example.Wasm
        # /p:RaskPathBase=/<repo> bakes the GH-Pages sub-path into the AppBundle's
        # index.html (<base href="/<repo>/">) at publish time. The framework's
        # build/Rask.Wasm.targets _RaskRewriteBaseHref target performs the rewrite
        # so the runtime's WasmHostBuilder.CreateDefault auto-detect picks up the
        # prefix from document.baseURI on first paint and emits every scoped-asset
        # <link>/<script> under /<repo>/_rask/a/{hash}.{ext}.
        run: dotnet publish samples/Rask.Example.Wasm -c Release -o publish /p:RaskPathBase=/${{ github.event.repository.name }}

      - name: Resolve bundle directory
        id: bundle
        run: |
          BUNDLE=samples/Rask.Example.Wasm/bin/Release/net10.0-browser/browser-wasm/AppBundle
          if [ ! -d "$BUNDLE" ]; then
            echo "Could not locate the WASM AppBundle at $BUNDLE" >&2
            find samples/Rask.Example.Wasm/bin -maxdepth 5 -type d
            exit 1
          fi
          echo "--- index.html (head) ---"
          head -n 20 "$BUNDLE/index.html"
          echo "dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Copy index.html to 404.html for SPA fallback
        run: cp "${{ steps.bundle.outputs.dir }}/index.html" "${{ steps.bundle.outputs.dir }}/404.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.bundle.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
