name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Publish Rask.Example.Wasm
        run: dotnet publish Rask.Example.Wasm -c Release -o publish

      - name: Resolve bundle directory
        id: bundle
        run: |
          BUNDLE=Rask.Example.Wasm/bin/Release/net10.0-browser/browser-wasm/AppBundle
          if [ ! -d "$BUNDLE" ]; then
            echo "Could not locate the WASM AppBundle at $BUNDLE" >&2
            find Rask.Example.Wasm/bin -maxdepth 5 -type d
            exit 1
          fi
          echo "dir=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Rewrite <base href> for sub-path hosting
        run: |
          # The bundled index.html ships <base href="/"/>. GitHub Pages serves under
          # https://<user>.github.io/<repo>/, so we swap the href to /<repo>/.
          sed -i 's|<base href="/"/>|<base href="/${{ github.event.repository.name }}/"/>|' "${{ steps.bundle.outputs.dir }}/index.html"
          echo "--- index.html (head) ---"
          head -n 20 "${{ steps.bundle.outputs.dir }}/index.html"

      - name: Copy index.html to 404.html for SPA fallback
        run: cp "${{ steps.bundle.outputs.dir }}/index.html" "${{ steps.bundle.outputs.dir }}/404.html"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.bundle.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
