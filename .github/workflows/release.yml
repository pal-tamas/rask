name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      - name: Pack Rask
        run: dotnet pack src/Rask/Rask.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Server
        run: dotnet pack src/Rask.Server/Rask.Server.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Wasm
        run: dotnet pack src/Rask.Wasm/Rask.Wasm.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Wasm.Hosting
        run: dotnet pack src/Rask.Wasm.Hosting/Rask.Wasm.Hosting.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Query
        run: dotnet pack src/Rask.Query/Rask.Query.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Spa.Hosting
        run: dotnet pack src/Rask.Spa.Hosting/Rask.Spa.Hosting.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.External
        run: dotnet pack src/Rask.External/Rask.External.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Tailwind
        run: dotnet pack src/Rask.Tailwind/Rask.Tailwind.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Validation.DataAnnotations
        run: dotnet pack src/Rask.Validation.DataAnnotations/Rask.Validation.DataAnnotations.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Validation.FluentValidation
        run: dotnet pack src/Rask.Validation.FluentValidation/Rask.Validation.FluentValidation.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Bootstrap
        run: dotnet pack src/Rask.Bootstrap/Rask.Bootstrap.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Cqrs
        run: dotnet pack src/Rask.Cqrs/Rask.Cqrs.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Cqrs.Client
        run: dotnet pack src/Rask.Cqrs.Client/Rask.Cqrs.Client.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Cqrs.Server
        run: dotnet pack src/Rask.Cqrs.Server/Rask.Cqrs.Server.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.WebPush
        run: dotnet pack src/Rask.WebPush/Rask.WebPush.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Signaling
        run: dotnet pack src/Rask.Signaling/Rask.Signaling.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite
        run: dotnet pack src/Rask.SQLite/Rask.SQLite.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite.EntityFrameworkCore
        run: dotnet pack src/Rask.SQLite.EntityFrameworkCore/Rask.SQLite.EntityFrameworkCore.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite.Litestream
        run: dotnet pack src/Rask.SQLite.Litestream/Rask.SQLite.Litestream.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite.Snapshots
        run: dotnet pack src/Rask.SQLite.Snapshots/Rask.SQLite.Snapshots.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite.Browser
        run: dotnet pack src/Rask.SQLite.Browser/Rask.SQLite.Browser.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Data
        run: dotnet pack src/Rask.Data/Rask.Data.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Outbox
        run: dotnet pack src/Rask.Outbox/Rask.Outbox.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Jobs
        run: dotnet pack src/Rask.Jobs/Rask.Jobs.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Mail
        run: dotnet pack src/Rask.Mail/Rask.Mail.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Cache
        run: dotnet pack src/Rask.Cache/Rask.Cache.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Logging
        run: dotnet pack src/Rask.Logging/Rask.Logging.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Dashboard
        run: dotnet pack src/Rask.Dashboard/Rask.Dashboard.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Testing
        run: dotnet pack src/Rask.Testing/Rask.Testing.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Cli (the `rask` dotnet tool)
        run: dotnet pack src/Rask.Cli/Rask.Cli.csproj -c Release --no-build -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.*nupkg

      - name: Push to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./artifacts/*.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
