name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Fast gate: every unit/integration test that does NOT need a browser.
  # Skips the expensive WASM work (-p:RaskWasm=false + -p:WasmBuildNative=false) since
  # no unit test consumes the published browser bundle. Mirrors ci.yml `unit`.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build (no WASM bundle)
        run: dotnet build Rask.slnx -c Release --no-restore -p:RaskWasm=false -p:WasmBuildNative=false -m:1

      - name: Unit & integration tests
        run: >-
          dotnet test Rask.slnx -c Release --no-build
          --filter "FullyQualifiedName!~Rask.Examples.E2E"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/TestResults/**

  # Browser journeys: exactly one comprehensive [Fact] journey per hosting project.
  # Sharded one host per runner so all fixtures boot in parallel. Mirrors ci.yml `e2e`.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each value is the concrete E2E test class — used verbatim as the test filter.
        host:
          - ServerExampleTests
          - WasmExampleTests
          - StandaloneWasmExampleTests
          - WasmSubPathExampleTests
          - AuthExampleTests
          - JwtServerAuthExampleTests
          - WasmCookieAuthExampleTests
          - WasmJwtAuthExampleTests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      - name: E2E journey (${{ matrix.host }})
        # Namespace-anchored so the leading dot prevents substring collisions
        # (e.g. ~WasmExampleTests would otherwise also match StandaloneWasmExampleTests).
        run: >-
          dotnet test tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~Rask.Examples.E2E.Tests.${{ matrix.host }}"
          --logger "trx;LogFileName=${{ matrix.host }}.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.host }}
          path: |
            **/TestResults/**
            **/bin/**/test-artifacts/**

  # Rask.Native ships its iOS/Android platform heads (RaskWkWebView / RaskAndroidWebView / NativeShare /
  # the Native+Server controllers), so its package must be built + packed on macOS with the mobile
  # workloads (-p:RaskNativeHeads=true multi-targets net10.0;net10.0-ios;net10.0-android). It's produced
  # here and handed to the publish job as an artifact.
  pack-native:
    needs: [unit, e2e]
    # Pinned to macos-26 (not the moving macos-latest label) so the Microsoft.iOS workload lands on the
    # matching Xcode SDK — same reason as native-ios-e2e.yml.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install iOS + Android workloads
        run: dotnet workload install ios android

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Pack Rask.Native (with iOS/Android heads)
        run: >-
          dotnet pack src/Rask.Native/Rask.Native.csproj -c Release
          -p:RaskNativeHeads=true -p:ValidateXcodeVersion=false -o ./artifacts

      - name: Upload Rask.Native package
        uses: actions/upload-artifact@v7
        with:
          name: native-nupkgs
          path: ./artifacts/Rask.Native.*.*nupkg

  # Pack & publish: gated on every test (unit + all e2e shards) being green.
  publish:
    needs: [unit, e2e, pack-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      - name: Pack Rask.Server
        run: dotnet pack src/Rask.Server/Rask.Server.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Wasm
        run: dotnet pack src/Rask.Wasm/Rask.Wasm.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Wasm.Hosting
        run: dotnet pack src/Rask.Wasm.Hosting/Rask.Wasm.Hosting.csproj -c Release --no-build -o ./artifacts

      # Rask.Native is packed WITH its iOS/Android platform heads on macOS (the pack-native job) — this
      # Ubuntu runner has no ios/android workloads. Pull that .nupkg/.snupkg into ./artifacts.
      - name: Download Rask.Native package (macOS-built, with heads)
        uses: actions/download-artifact@v7
        with:
          name: native-nupkgs
          path: ./artifacts

      - name: Pack Rask.Validation.DataAnnotations
        run: dotnet pack src/Rask.Validation.DataAnnotations/Rask.Validation.DataAnnotations.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Validation.FluentValidation
        run: dotnet pack src/Rask.Validation.FluentValidation/Rask.Validation.FluentValidation.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Templates
        run: dotnet pack src/Rask.Templates/Rask.Templates.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Bootstrap
        run: dotnet pack src/Rask.Bootstrap/Rask.Bootstrap.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Cqrs
        run: dotnet pack src/Rask.Cqrs/Rask.Cqrs.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.WebPush
        run: dotnet pack src/Rask.WebPush/Rask.WebPush.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite
        run: dotnet pack src/Rask.SQLite/Rask.SQLite.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.SQLite.Litestream
        run: dotnet pack src/Rask.SQLite.Litestream/Rask.SQLite.Litestream.csproj -c Release --no-build -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.*nupkg

      - name: Push to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./artifacts/*.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
