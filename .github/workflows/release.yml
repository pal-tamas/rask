name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # Every gate, the release-only ones included (deploy, installer, providers, watch): nothing is
  # packed or pushed from a tag they did not pass. Try them ahead of the tag on a ci/release/** branch.
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      set: all

  publish:
    needs: gates
    runs-on: ubuntu-26.04
    # GitHub's own maximum, said out loud so nobody lowers it. The verify step alone can take three hours of
    # validation (RASK_VERIFY_FLAT_DEADLINE) plus two half-hour restore waits, four hours in all, and the
    # build, pack and push before it take most of an hour, more when the push waits on nuget.org level by
    # level -- so a longer validation wait would not fit.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # MinVer needs full history + tags

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      # ONE pack, for the whole solution.
      #
      # This was 35 hand-written `dotnet pack` steps, and the list went stale in the way a hand-written
      # list always does: at the v0.20.0 tag it held 24 projects, while 16 packable projects had been
      # added since. Those 16 were never packed by a TAGGED run, so they had nightly prereleases and no
      # stable line at all -- and Rask.Query and Rask.Auth are both on the default battery set, so
      # `rask new Shop` from the released CLI could not restore (#1044). Nothing failed; nothing was
      # throttled. They simply were not on the list.
      #
      # Packing the solution has no list to go stale: a project carrying IsPackable=false (every test
      # project, the MSBuild task projects, Rask.Site) is skipped by the SDK, and everything else is packed
      # because it exists. Verified to produce exactly the 39 packable projects and no others.
      #
      # No --no-build: pack on a solution re-invokes Build for the non-packable projects and
      # NETSDK1085 fails the run. The build above has already done the work, so this is incremental.
      - name: Pack every packable project
        run: dotnet pack Rask.slnx -c Release -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nupkgs
          path: ./artifacts/*.*nupkg

      # Dependencies first, and a package only once nuget.org SERVES what it depends on, each push retried
      # (scripts/lib/publish_packages.py -- nightly.yml publishes through the same script). A re-run packs
      # the same tag, so the same version, and --skip-duplicate picks up where the first attempt stopped.
      # The tag names the version, so no other commit packs it -- and should one be served all the same,
      # the push refuses before its first package and verify fails: a version is one commit's.
      #
      # push.log is for the verify step below: only the push's own answer can tell "never pushed" from
      # "accepted, still in nuget.org's validation" (#1125).
      - name: Push to nuget.org, dependencies first
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          python3 scripts/lib/publish_packages.py push ./artifacts
          --source https://api.nuget.org/v3/index.json
          --api-key-env NUGET_API_KEY
          --gate-index nuget.org
          --projects src
          --commit "$GITHUB_SHA"
          --log push.log

      # Idempotent, so a re-run of a release that failed further down gets past this step instead of
      # dying on "release already exists" before it reaches the steps it was re-run for (#1125).
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" ./artifacts/*.nupkg --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              ./artifacts/*.nupkg \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

      # Every package of the version, not only the ones a scaffold restores. Three hours, because that is
      # what Rask.Cli's extended validation can take (below); the summary names the version and its commit.
      - name: Wait until nuget.org serves the whole version
        run: python3 scripts/lib/publish_packages.py verify ./artifacts --wait "${RASK_VERIFY_FLAT_DEADLINE:-10800}"

      # Does what was just pushed actually WORK? Until #1044 nothing asked.
      #
      # A release is the one moment the whole package set is supposed to exist, and the failure it hides
      # is silent: a CLI that pins itself to a version some of its own dependencies never reached. The
      # check is the user's first command -- `rask new` and a restore -- against nuget.org alone.
      #
      # Not continue-on-error. A release whose scaffold cannot restore is a broken release, and saying
      # so on the run that produced it is the whole point. The packages are already pushed by then, so
      # this reports rather than prevents -- which is still the difference between finding out here and
      # finding out from a user.
      #
      # It can wait hours: a package carrying an executable (Rask.Cli's apphost) goes through nuget.org's
      # extended validation, 2h17m on v0.23.0. The push log is what lets it wait that long for a package
      # nuget.org accepted, and fail at once for one it did not.
      - name: Verify a scaffolded project restores from nuget.org
        run: scripts/verify-release-restore.sh "${GITHUB_REF_NAME}" push.log

      # The released version is the only one that stays listed: previous stables and every nightly
      # prerelease are unlisted, so the gallery shows what you would actually install. Unlisting is not
      # deletion -- nuget.org has no delete for owners, and a pinned PackageReference still restores.
      #
      # Runs last, and cannot fail the release: the packages are already pushed, and nuget.org rate-limits
      # unlisting to roughly 250 calls before a 403 with a retry-after in tens of minutes. The script
      # spends one budget and stops; whatever is left is picked up by the next release, which supersedes
      # it anyway. NUGET_API_KEY needs the *Unlist* scope -- a push-only key no-ops with a warning.
      #
      # After the verify step on purpose, and not `if: always()` (#1125). Run ahead of a new version
      # nuget.org is still validating -- hours, for Rask.Cli -- it would unlist every previous version
      # while the new one is not installable yet, leaving `dotnet tool install Rask.Cli` nothing to find.
      # What skipped it on v0.23.0 was the verify step's wrong verdict, which the push log now corrects.
      - name: Unlist superseded versions
        continue-on-error: true
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: scripts/unlist-old-versions.sh "${GITHUB_REF_NAME}" ./artifacts
