name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        run: dotnet build Rask.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Rask.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx" --logger "console;verbosity=normal"

      - name: Pack Rask.Server
        run: dotnet pack src/Rask.Server/Rask.Server.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Wasm
        run: dotnet pack src/Rask.Wasm/Rask.Wasm.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Wasm.Hosting
        run: dotnet pack src/Rask.Wasm.Hosting/Rask.Wasm.Hosting.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Validation.DataAnnotations
        run: dotnet pack src/Rask.Validation.DataAnnotations/Rask.Validation.DataAnnotations.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Validation.FluentValidation
        run: dotnet pack src/Rask.Validation.FluentValidation/Rask.Validation.FluentValidation.csproj -c Release --no-build -o ./artifacts

      - name: Pack Rask.Templates
        run: dotnet pack src/Rask.Templates/Rask.Templates.csproj -c Release --no-build -o ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v5
        with:
          name: nupkgs
          path: ./artifacts/*.*nupkg

      - name: Push to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ secrets.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ./artifacts/*.nupkg \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
