name: e2e

# Reusable browser-journey pipeline shared by ci / nightly / release. Builds the whole E2E graph ONCE,
# then fans out one shard per hosting project that runs the *prebuilt* test assembly directly under VSTest
# (`dotnet test <dll>`) — no per-shard restore and no MSBuild graph evaluation. Callers pass the concrete
# E2E test-class names to shard across (a JSON array).
on:
  workflow_call:
    inputs:
      hosts:
        description: JSON array of E2E test-class names — each becomes one shard and the test filter.
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Build the whole E2E graph ONCE and hand the output to every shard, instead of each shard rebuilding
  # the solution (the E2E test project references every sample host, so a shard can't build a narrower
  # graph). The shards then run the prebuilt assembly under VSTest, so the expensive build — including the
  # nested WASM publishes that touch emscripten — happens a single time.
  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: MinVer must derive the real version here. The Rask routes generator bakes a
          # version-consistent cross-assembly identity into __RaskRoutesRegistry, so a published host that
          # runs out-of-process (e.g. Rask.Example.Server → Rask.Example.Shared) FAILS to load that
          # assembly at startup if the build used a MinVer fallback version (MinVerSkip / shallow clone).
          # In-process test/benchmark jobs are unaffected (the assembly is already loaded), so they stay
          # shallow — but this artifact feeds a real published server, so it needs the true version.
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        # -m:1 stays: the RaskWasm bundle's nested `dotnet publish` still double-builds Rask.Core.dll
        # (net10.0-browser) against the top-level WASM build, and serial is the correctness insurance
        # against that copy race (MSB3026/MSB3030) for the single build that triggers it.
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      - name: Publish Server sample (used by the ServerExampleTests shard)
        # The server shard's fixture boots the *published* Rask.Example.Server host. Publish it ONCE here so
        # the shard doesn't repeat a from-scratch restore+compile+publish at fixture startup. Default output
        # → bin/Release/net10.0/publish, packaged by the tar below; the fixture prefers this prebuilt DLL.
        run: dotnet publish samples/Rask.Example.Server -c Release --no-build --no-restore --nologo

      - name: Publish Playground sample (served by the PlaygroundExampleTests shard)
        # Untrimmed WASM bundle (Roslyn compiles Rask C# in the browser, so it can't be trimmed).
        # WasmBuildNative=false uses the prebuilt .NET-WASM runtime (skips the flaky emscripten relink).
        run: dotnet publish samples/Rask.Example.Playground -c Release --no-restore -p:WasmBuildNative=false --nologo

      - name: Publish landing site sample (served by the SiteExampleTests shard)
        # Standalone Rask WASM app (no host project), so it isn't published by any nested Hosting publish —
        # publish it explicitly. Harmless for callers whose matrix omits SiteExampleTests (they just don't
        # run that shard); keeps one build-once code path across ci / nightly / release.
        run: dotnet publish samples/Rask.Example.Site -c Release --no-restore -p:WasmBuildNative=false --nologo

      - name: Package build output
        # Tar every bin/ and obj/: the shards need the built test + sample assemblies, the published WASM
        # wwwroot bundles, the published Server host, and the restore assets (obj/project.assets.json) that
        # the publish-based / `dotnet run --no-build` fixtures require — so no shard has to restore.
        run: |
          find . -type d \( -name bin -o -name obj \) -prune -print0 \
            | tar --null --files-from=- -cf build-output.tar

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-output
          path: build-output.tar
          retention-days: 1

  # Browser journeys: one comprehensive journey per hosting project, sharded one host per runner so all
  # fixtures boot in parallel. Each shard consumes the shared build output and runs the prebuilt test DLL
  # directly under VSTest — no restore, no build, no graph evaluation.
  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(inputs.hosts) }}
    steps:
      - uses: actions/checkout@v7   # shallow: the shard neither builds nor packs

      - uses: ./.github/actions/setup
        with:
          nuget-cache: 'false'   # VSTest-direct never restores
          playwright: 'true'
          # The wasm-tools workload is only needed by shards whose fixture shells `dotnet run --no-build`
          # on a net10.0-browser host (MSBuild graph eval imports the wasm targets). The publish-based
          # (ServerExampleTests) and static-host WASM shards (Standalone/Site/Playground) need neither a
          # workload nor graph eval, so they skip it. When kept, the composite's cache makes it a fast unpack.
          workloads: >-
            ${{ contains(fromJSON('["WasmExampleTests","WasmCookieAuthExampleTests","WasmJwtAuthExampleTests","WasmSubPathExampleTests","AuthExampleTests","JwtServerAuthExampleTests"]'), matrix.host) && 'wasm-tools' || '' }}

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: e2e-build-output

      - name: Extract build output
        # Overlay the shared bin/ + obj/ onto the fresh checkout so the prebuilt assembly + its restore
        # assets are present.
        run: tar -xf build-output.tar

      - name: E2E journey (${{ matrix.host }})
        # Run the prebuilt net10.0 test assembly directly under VSTest — no csproj, so no --no-build graph
        # evaluation. Namespace-anchored filter (leading dot) prevents substring collisions
        # (e.g. ~WasmExampleTests would otherwise also match StandaloneWasmExampleTests).
        run: >-
          dotnet test tests/Rask.Examples.E2E.Tests/bin/Release/net10.0/Rask.Examples.E2E.Tests.dll
          --filter "FullyQualifiedName~Rask.Examples.E2E.Tests.${{ matrix.host }}"
          --logger "trx;LogFileName=${{ matrix.host }}.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.host }}
          path: |
            **/TestResults/**
            **/bin/**/test-artifacts/**
