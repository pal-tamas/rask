name: gates

# The gates, as jobs. Called by ci.yml (every push), full.yml (the whole push set, once a day)
# and release.yml — ONE list, so they cannot drift. Each job runs the same script a developer
# runs by hand, which keeps a red job reproducible with one command.
#
#   push     what a push to main is held to
#   deps     the part of push a version bump can break before it lands: build, unit, format, CLI build, templates,
#            and the front end of each template whose client the pull request changes
#   release  what needs containers or a real host; run before a release, and on a ci/release/** branch
#   all      push and release
#
# scope: affected narrows the set to the gates the change can reach — scripts/lib/affected_gates.py
# answers from the diff base..HEAD, and each gate names the answer that selects it ("when"). Anything
# that script will not narrow runs the whole set, and so does scope: full.
on:
  workflow_call:
    inputs:
      set:
        description: push | deps | release | all
        type: string
        required: true
      only:
        description: an ERE over gate names; empty runs the whole set
        type: string
        required: false
        default: ''
      ref:
        description: The commit to gate. Empty gates the one the caller ran on; upstream.yml names the commit it is about to land.
        type: string
        default: ''
      scope:
        description: full | affected
        type: string
        default: full
      base:
        description: With scope affected, the commit the change is measured from. Empty runs the whole set.
        type: string
        default: ''
      parallel:
        description: How many gates run at once. The account runs twenty jobs at a time; full.yml takes fewer.
        type: number
        default: 20

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10   # seconds of git, python and jq
    outputs:
      gates: ${{ steps.pick.outputs.gates }}
      site_gates: ${{ steps.pick.outputs.site_gates }}
      mode: ${{ steps.pick.outputs.mode }}
      range: ${{ steps.pick.outputs.range }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # the diff from the base commit

      - id: pick
        env:
          SET: ${{ inputs.set }}
          ONLY: ${{ inputs.only }}
          SCOPE: ${{ inputs.scope }}
          BASE: ${{ inputs.base }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          # "mode" says which kind of run a gate belongs to: the whole set cuts the unit tests and the
          # formatter in two, a scoped run has little enough of either for one job each.
          # "when" is the key from scripts/lib/affected_gates.py that selects the gate in a scoped run.
          #
          # The unit gate: "build" is the warnings-as-errors build with the analyzers and the gate
          # script tests; the "unit" and "format" jobs build without analyzers and then run tests or
          # the formatter. run-unit-local.sh says why at RASK_UNIT_PART.
          #
          # The browser suite runs four classes at a time (one browser, a context per test), and is cut
          # three ways by class over the ONE site the `site` job publishes. Shards 1-2 NAME their
          # classes and shard 3 takes everything they do not: a new or renamed class lands in 3 by
          # itself and cannot fall between two. The three classes that read the clipboard back
          # (WasmExample, UiKitFormControls, UiKitColorPicker) are one per shard: a browser has one
          # clipboard. The Rask.Server journeys need no site and are a job of their own.
          # Dealt by measured seconds of journeys, one at a time (505, 446, 415 of 1366 on 2026-11-03);
          # the slowest shard is the WHOLE run's time, and so how long a fix waits for its package, so
          # re-deal when one drifts.
          #
          # "each": "front end" is one gate per front-end template, expanded below from the script's own
          # list (a tree with a committed npm client), so a new template is a new job with no edit here:
          # "front end react", run with that key appended, selected by "frontend-react". Each packs the
          # feed and publishes a scaffold, which is minutes — seven in one job would not fit the timeout.
          # "deps": "touched" puts one in the deps set only when the pull request changes that
          # template's client, which is what a lockfile bump is: dependabot-merge.yml then merges a
          # template bump on the verdict of the template it changed, and a NuGet bump pays for none.
          #
          # The benchmark gate is the byte and allocation budgets only — exact counts, the same on a
          # shared runner as anywhere. No time is measured here: a runner's clock proves nothing.
          GATES: >-
            [
              {"set": "push", "deps": true, "when": "code",                    "name": "build",              "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "build"},
              {"set": "push",               "when": "code", "mode": "scoped",  "name": "unit",               "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "tests"},
              {"set": "push", "deps": true,                 "mode": "full",    "name": "unit 1/2",           "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "tests-1/2"},
              {"set": "push", "deps": true,                 "mode": "full",    "name": "unit 2/2",           "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "tests-2/2"},
              {"set": "push",               "when": "cs",   "mode": "scoped",  "name": "format",             "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "format"},
              {"set": "push", "deps": true,                 "mode": "full",    "name": "format src",         "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "format-src"},
              {"set": "push", "deps": true,                 "mode": "full",    "name": "format tests",       "run": "scripts/run-unit-local.sh --lane-slots $(nproc)", "part": "format-tests"},
              {"set": "push", "when": "site",      "name": "browser E2E 1/3",    "run": "scripts/run-e2e-local.sh", "browser": true, "suite": "site", "site": true, "filter": "FullyQualifiedName~.WasmExampleTests|FullyQualifiedName~.UiKitCursorTests|FullyQualifiedName~.UiKitPickersTests|FullyQualifiedName~.UiKitSelectTests|FullyQualifiedName~.UiKitLayoutTests"},
              {"set": "push", "when": "site",      "name": "browser E2E 2/3",    "run": "scripts/run-e2e-local.sh", "browser": true, "suite": "site", "site": true, "filter": "FullyQualifiedName~.UiKitActionsTests|FullyQualifiedName~.UiKitDataDisplayTests|FullyQualifiedName~.UiKitFormControlsTests|FullyQualifiedName~.UiKitRichInputsTests|FullyQualifiedName~.UiKitNativeFeelTests"},
              {"set": "push", "when": "site",      "name": "browser E2E 3/3",    "run": "scripts/run-e2e-local.sh", "browser": true, "suite": "site", "site": true, "filter": "FullyQualifiedName!~.WasmExampleTests&FullyQualifiedName!~.UiKitCursorTests&FullyQualifiedName!~.UiKitPickersTests&FullyQualifiedName!~.UiKitSelectTests&FullyQualifiedName!~.UiKitLayoutTests&FullyQualifiedName!~.UiKitActionsTests&FullyQualifiedName!~.UiKitDataDisplayTests&FullyQualifiedName!~.UiKitFormControlsTests&FullyQualifiedName!~.UiKitRichInputsTests&FullyQualifiedName!~.UiKitNativeFeelTests"},
              {"set": "push", "when": "server",    "name": "server E2E",         "run": "scripts/run-e2e-local.sh", "browser": true, "suite": "server"},
              {"set": "push", "when": "devtools",  "name": "devtools E2E",       "run": "scripts/run-devtools-e2e-local.sh", "browser": true},
              {"set": "push", "when": "sqlite",    "name": "browser SQLite E2E", "run": "scripts/run-browser-sqlite-e2e-local.sh", "browser": true},
              {"set": "push", "when": "datademo",  "name": "data demo E2E",      "run": "scripts/run-data-demo-e2e-local.sh", "browser": true},
              {"set": "push", "when": "wasm",      "name": "WASM E2E",           "run": "scripts/run-wasm-e2e-local.sh", "browser": true},
              {"set": "push", "when": "bench",     "name": "benchmarks",         "run": "scripts/run-benchmarks-local.sh"},
              {"set": "push", "deps": true, "when": "packaging", "name": "CLI build", "run": "scripts/run-cli-build-e2e.sh"},
              {"set": "push", "deps": true, "when": "packaging", "name": "templates", "run": "scripts/run-template-e2e.sh"},
              {"set": "push", "deps": "touched", "each": "front end", "name": "front end", "run": "scripts/run-template-e2e.sh --front-end="},
              {"set": "release", "name": "watch hot reload",   "run": "scripts/run-watch-e2e.sh"},
              {"set": "release", "name": "deploy",             "run": "scripts/run-deploy-e2e-local.sh"},
              {"set": "release", "name": "storage providers",  "run": "scripts/run-storage-providers-local.sh"},
              {"set": "release", "name": "installer",          "run": "scripts/run-install-e2e-local.sh"},
              {"set": "release", "name": "providers",          "run": "scripts/run-providers-local.sh"}
            ]
        run: |
          mode=full
          keys=""
          range=""

          if [ "$SCOPE" = "affected" ] && [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            answer="$(git diff --name-only "$BASE" HEAD | python3 scripts/lib/affected_gates.py .)"
            case "$answer" in
              FULL*)
                echo "gates: the whole set — $(printf '%s' "$answer" | cut -f2-)"
                ;;
              *)
                mode=scoped
                keys="$answer"
                range="$BASE..$(git rev-parse HEAD)"
                echo "gates: scoped to [$keys] over $range"
                ;;
            esac
          elif [ "$SCOPE" = "affected" ]; then
            echo "gates: the whole set — no usable base commit ('$BASE') to measure the change from"
          fi

          # What a pull request changes, for the gates a deps run takes only when touched. Unknown
          # (null) takes them all: a gate too many costs minutes, a gate too few merges unchecked.
          changed=null
          if [ -n "$PR_BASE" ] && git cat-file -e "$PR_BASE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$PR_BASE" HEAD | jq -Rnc '[inputs]')"
          fi
          front_ends="$(scripts/run-template-e2e.sh --list-front-ends | jq -Rnc '[inputs]')"

          gates="$(jq -c --arg set "$SET" --arg only "$ONLY" --arg mode "$mode" --arg keys "$keys" \
                      --argjson changed "$changed" --argjson front_ends "$front_ends" '
            ($keys | split(" ")) as $reached
            | [ .[]
                | if .each == "front end"
                  then . as $gate | $front_ends[]
                       | $gate + {name: "\($gate.name) \(.)", run: "\($gate.run)\(.)", when: "frontend-\(.)",
                                  touched: "^src/Rask\\.Templates/\(.)/client/"}
                  else . end
                | select($set == "all" or .set == $set
                         or ($set == "deps" and (.deps == true or (.deps == "touched" and (.touched as $paths
                             | $changed == null or any($changed[]; test($paths)))))))
                | select($only == "" or (.name | test($only)))
                | select(if $mode == "full"
                         then (.mode // "") != "scoped"
                         else (.mode // "") != "full" and ((.when // "") as $when | $reached | index($when)) != null
                         end)
                | del(.each, .touched) ]' <<<"$GATES")"
          [ "$gates" != "[]" ] || { echo "gates: set '$SET' with only '$ONLY' selects no gate" >&2; exit 1; }

          echo "gates: $(jq -r '[.[].name] | join(", ")' <<<"$gates")"
          # The gates that drive the published site wait for the one job that publishes it; no other
          # gate waits for anything.
          site_gates="$(jq -c '[.[] | select(.site)]' <<<"$gates")"
          gates="$(jq -c '[.[] | select(.site | not)]' <<<"$gates")"
          {
            echo "site_gates=$site_gates"
            echo "gates=$gates"
            echo "mode=$mode"
            echo "range=$range"
          } >> "$GITHUB_OUTPUT"

  # The site the browser shards drive, published once and handed to each of them as an artifact. Each
  # shard published it again until 2026-11-03: five to eight minutes, five times, for the same bytes.
  # Only the shards wait for this job; every other gate starts with the plan.
  site:
    needs: plan
    if: needs.plan.outputs.site_gates != '[]'
    name: site publish
    runs-on: ubuntu-26.04
    timeout-minutes: 30   # about eight minutes; a hung publish must not hold the shards back for long
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # the guides' history and the sitemap's lastmod are read from the log

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools

      - name: Publish the site
        env:
          RASK_E2E_SITE: publish
          RASK_BUILD_SLOTS: 4
        run: scripts/run-e2e-local.sh

      - uses: actions/upload-artifact@v7
        with:
          name: site-wwwroot
          path: src/Rask.Site/bin/Release/net10.0-browser/publish/wwwroot
          retention-days: 1   # read by this run's shards, minutes from now, and by nothing else
          if-no-files-found: error

  gate:
    needs: plan
    if: needs.plan.outputs.gates != '[]'
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-26.04
    # The longest gate (format src) took 25.5 minutes on 2026-11-02, so thirty timed out a slow runner's
    # healthy run; a hung one must still not hold a runner for long.
    timeout-minutes: 40
    strategy:
      fail-fast: false   # one red gate says nothing about the others; report all of them
      max-parallel: ${{ inputs.parallel }}
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.gates) }}
    steps: &gate-steps
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0   # MinVer packs in the CLI gates, GuideHistoryTests reads the log, a scoped run diffs

      - uses: ./.github/actions/setup
        with:
          workloads: wasm-tools
          playwright: ${{ matrix.gate.browser && 'true' || 'false' }}

      # A browser shard drives the site the `site` job published, put back exactly where the publish
      # writes it; scripts/run-e2e-local.sh then skips its own publish (RASK_E2E_SITE=prebuilt).
      - name: The published site
        if: matrix.gate.site
        uses: actions/download-artifact@v8
        with:
          name: site-wwwroot
          path: src/Rask.Site/bin/Release/net10.0-browser/publish/wwwroot

      # The gate scripts install Chromium themselves; the system libraries it links are the runner's.
      - name: ${{ matrix.gate.name }}
        env:
          RASK_E2E_FILTER: ${{ matrix.gate.filter }}
          RASK_E2E_SUITE: ${{ matrix.gate.suite }}
          RASK_E2E_SITE: ${{ matrix.gate.site && 'prebuilt' || '' }}
          RASK_UNIT_PART: ${{ matrix.gate.part }}
          RASK_BUILD_SLOTS: 4   # the browser gates publish on one core unless told otherwise
          # A scoped run: the unit gate builds, tests and formats what the range reaches. Empty on a
          # whole run, where the gate does everything.
          RASK_TEST_SCOPE: ${{ needs.plan.outputs.mode == 'scoped' && 'affected' || '' }}
          RASK_FORMAT_SCOPE: ${{ needs.plan.outputs.mode == 'scoped' && 'range' || '' }}
          RASK_SCOPE_RANGE: ${{ needs.plan.outputs.range }}
        run: ${{ matrix.gate.run }}

  # The browser shards: the same steps as every gate (one YAML anchor, so the two cannot drift), started
  # once the site they drive is published.
  site-gate:
    needs: [plan, site]
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.parallel }}
      matrix:
        gate: ${{ fromJSON(needs.plan.outputs.site_gates) }}
    steps: *gate-steps
