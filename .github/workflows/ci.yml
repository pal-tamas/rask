name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast PR gate: every unit/integration test that does NOT need a browser.
  # Skips the expensive WASM work (-p:RaskWasm=false disables the scoped-asset bake /
  # static-web-asset injection; -p:WasmBuildNative=false skips the emscripten relink) since
  # no unit test consumes the published browser bundle. Runs in parallel with `e2e`.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      # Dependency hygiene. NuGetAudit already fails restore on vulnerable packages (honouring the
      # scoped NuGetAuditSuppress entries), so this is defence-in-depth that also covers transitive
      # vulnerabilities and DEPRECATED packages — which audit does not flag. `dotnet list package`
      # exits 0 even on findings, so we parse its output. The accepted-and-suppressed SQLitePCLRaw
      # advisory (GHSA-2m69-gcr7-jv3q, no patched version) is excluded so it doesn't re-fail here;
      # remove that filter once a patched SQLitePCLRaw family ships.
      - name: Vulnerable & deprecated package scan
        run: |
          set -euo pipefail
          echo "== Vulnerable (incl. transitive) =="
          dotnet list Rask.slnx package --vulnerable --include-transitive > vuln.log 2>&1 || true
          cat vuln.log
          unexpected="$(grep -E '^\s*>' vuln.log | grep -v 'GHSA-2m69-gcr7-jv3q' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected vulnerable package(s) found:"
            echo "$unexpected"
            exit 1
          fi
          echo "== Deprecated =="
          dotnet list Rask.slnx package --deprecated > deprecated.log 2>&1 || true
          cat deprecated.log
          # Package rows start with '>'. "Legacy" means superseded-but-functional (e.g. xunit v2 ->
          # v3, a large separate migration); treat those as informational. Fail only on harder
          # deprecation reasons (Critical Bugs / Other) that warrant action now.
          deprecated_rows="$(grep -E '^\s*>' deprecated.log || true)"
          if [ -n "$deprecated_rows" ]; then
            actionable="$(printf '%s\n' "$deprecated_rows" | grep -v -i 'Legacy' || true)"
            if [ -n "$actionable" ]; then
              echo "::error::Actionable deprecated package(s) found:"
              echo "$actionable"
              exit 1
            fi
            echo "::warning::Legacy (superseded) packages present — informational only:"
            printf '%s\n' "$deprecated_rows"
          fi

      - name: Build (no WASM bundle)
        # -p:RaskWasm=false now genuinely skips the nested WASM publish: Rask.Wasm.Hosting.targets
        # gates _RaskPublishWasmBundle on the effective $(RaskWasm) property (the XmlPeek probe
        # alone can't be turned off from the outer build). With that publish gone there is no second
        # writer of Rask.Core.dll, so the MSB3026/MSB3030 copy race can't occur and the build runs
        # in parallel (dropping the old -m:1). This also stops the "fast" gate silently paying for a
        # full WASM publish it believed -p:RaskWasm=false had disabled.
        run: dotnet build Rask.slnx -c Release --no-restore -p:RaskWasm=false -p:WasmBuildNative=false

      - name: Unit & integration tests
        run: >-
          dotnet test Rask.slnx -c Release --no-build
          --filter "FullyQualifiedName!~Rask.Examples.E2E"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            **/TestResults/**

  # Deterministic perf-regression gate. Wire-bytes-per-update for a fixed set of scenarios is noise-free
  # (no timing — every render emits the same payload shape with one small value differing), so we compare
  # it byte-for-byte against the committed baselines and fail the PR on a regression. Covers both the
  # standalone codec numbers (Rask.Benchmarks) and the head-to-head against Blazor
  # (Rask.Benchmarks.VsBlazor). The mem-footprint report runs informationally only — its GC-counter
  # numbers are noisy, so they are logged, not gated. Fast (no BDN timing, no WASM, no browser) so it runs
  # on every PR; the full BenchmarkDotNet timing suites run on nightly (too noisy on shared runners to
  # gate on) — see the `benchmarks-full` job in nightly.yml.
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: |
          dotnet restore benchmarks/Rask.Benchmarks/Rask.Benchmarks.csproj
          dotnet restore benchmarks/Rask.Benchmarks.VsBlazor/Rask.Benchmarks.VsBlazor.csproj

      - name: Build benchmark projects
        # The benchmark projects reference no WASM host, so no nested WASM publish fires and there is
        # no Rask.Core.dll copy race — they build in parallel (no -m:1).
        run: |
          dotnet build benchmarks/Rask.Benchmarks/Rask.Benchmarks.csproj -c Release --no-restore
          dotnet build benchmarks/Rask.Benchmarks.VsBlazor/Rask.Benchmarks.VsBlazor.csproj -c Release --no-restore

      - name: Payload-bytes regression gate (standalone codec)
        run: >-
          dotnet run -c Release --project benchmarks/Rask.Benchmarks --no-build -- payload-bytes --check

      - name: Payload-bytes regression gate (vs Blazor)
        run: >-
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor --no-build -- payload-bytes --check

      - name: Memory footprint (informational — GC-noisy, not gated)
        run: >-
          dotnet run -c Release --project benchmarks/Rask.Benchmarks.VsBlazor --no-build -- mem-footprint

  # Build the whole E2E graph ONCE and hand the output to every browser-journey shard, instead of
  # each of the 10 shards rebuilding the entire solution (the E2E test project references every
  # sample host, so a shard can't build a narrower graph). The shards then run `--no-build` off the
  # downloaded output, so the expensive build — including the nested WASM publishes that touch
  # emscripten — happens a single time.
  # -m:1 stays on this one build: the RaskWasm bundle's nested `dotnet publish` still double-builds
  # Rask.Core.dll (net10.0-browser) against the top-level WASM build, and serial is the correctness
  # insurance against that copy race (MSB3026/MSB3030) for the single build that triggers it. (The
  # `unit`/`benchmarks` jobs drop -m:1 because -p:RaskWasm=false now genuinely skips that publish.)
  e2e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Rask.slnx

      - name: Build
        run: dotnet build Rask.slnx -c Release --no-restore -m:1

      - name: Publish Server sample (used by the ServerExampleTests shard)
        # The server shard's fixture boots the *published* Rask.Example.Server host. Publish it ONCE here,
        # off the graph we just built, so the shard doesn't repeat a from-scratch restore+compile+publish at
        # fixture startup (that duplicated ~15 min was the whole reason that shard dwarfed the rest).
        # Default output → bin/Release/net10.0/publish, picked up verbatim by the tar below; the fixture
        # launches this prebuilt DLL when it's present and only publishes on demand as a local-dev fallback.
        run: dotnet publish samples/Rask.Example.Server -c Release --no-build --no-restore --nologo

      - name: Package build output
        # Tar every bin/ and obj/: the shards need the built test + sample assemblies, the published
        # WASM wwwroot bundles the WASM fixtures serve, the published Server host the two server shards
        # boot, and the restore assets that `dotnet run --no-build` and the publish-based fixtures require.
        # Plain tar — upload-artifact compresses. -prune stops the walk from descending into a matched dir.
        run: |
          find . -type d \( -name bin -o -name obj \) -prune -print0 \
            | tar --null --files-from=- -cf build-output.tar

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: e2e-build-output
          path: build-output.tar
          retention-days: 1

  # Browser journeys: exactly one comprehensive [Fact] journey per hosting project. Sharded one host
  # per runner so all fixtures boot in parallel. Each shard consumes the shared `e2e-build` output and
  # runs --no-build (no rebuild) — trading a little wall-clock (build-then-fan-out) for ~9× fewer
  # runner-minutes than every shard rebuilding the solution.
  e2e:
    needs: e2e-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each value is the concrete E2E test class — used verbatim as the test filter.
        host:
          - ServerExampleTests
          - WasmExampleTests
          - StandaloneWasmExampleTests
          - WasmSubPathExampleTests
          - AuthExampleTests
          - JwtServerAuthExampleTests
          - WasmCookieAuthExampleTests
          - WasmJwtAuthExampleTests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # `dotnet test --no-build` still evaluates the project graph, which imports the wasm-tools
      # targets for the net10.0-browser project references; the two publish-based fixtures
      # (Server/NativeServerSmoke) also `dotnet publish` at runtime. Keep the workload + NuGet cache.
      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Download build output
        uses: actions/download-artifact@v7
        with:
          name: e2e-build-output

      - name: Extract build output
        # Overlay the shared bin/ + obj/ onto the fresh checkout so --no-build sees the built graph.
        run: tar -xf build-output.tar

      - name: E2E journey (${{ matrix.host }})
        # Namespace-anchored so the leading dot prevents substring collisions
        # (e.g. ~WasmExampleTests would otherwise also match StandaloneWasmExampleTests).
        run: >-
          dotnet test tests/Rask.Examples.E2E.Tests/Rask.Examples.E2E.Tests.csproj
          -c Release --no-build
          --filter "FullyQualifiedName~Rask.Examples.E2E.Tests.${{ matrix.host }}"
          --logger "trx;LogFileName=${{ matrix.host }}.trx"
          --logger "console;verbosity=normal"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results-${{ matrix.host }}
          path: |
            **/TestResults/**
            **/bin/**/test-artifacts/**

  # Compile gate for the runnable native showcase examples (samples/Rask.Example.Native [Native + Local]
  # and samples/Rask.Example.Native.Server [Native + Server]). They multi-target net10.0-ios;net10.0-android,
  # so they are kept OUT of Rask.slnx (the Ubuntu jobs have neither workload) and built here on macOS
  # instead. We build every project × TFM — a green build proves the platform heads + the shared
  # NativeOriginAssets wiring compile. On-device behaviour is verified by the `native-appium` job below.
  native:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - samples/Rask.Example.Native/Rask.Example.Native.csproj
          - samples/Rask.Example.Native.Server/Rask.Example.Native.Server.csproj
        tfm: [net10.0-android, net10.0-ios]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install iOS + Android workloads
        run: dotnet workload install ios android

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build/compile ${{ matrix.project }} (${{ matrix.tfm }})
        # RaskNativeHeads=true makes Rask.Native build its platform heads. Android does a full build.
        # For iOS we COMPILE-ONLY (Roslyn): the full app's native link needs the exact Xcode/iOS SDK the
        # Microsoft.iOS workload wants, which trails the GitHub runner's Xcode (MT0180). Compile-only still
        # catches iOS head compile breaks; the full iOS build + on-device XCUITest run happens nightly in
        # native-ios-e2e.yml (and locally; see docs/native.md).
        run: |
          if [[ "${{ matrix.tfm }}" == *-ios ]]; then
            dotnet build ${{ matrix.project }} -c Release -f ${{ matrix.tfm }} -p:RaskNativeHeads=true -p:ValidateXcodeVersion=false -t:Compile
          else
            dotnet build ${{ matrix.project }} -c Release -f ${{ matrix.tfm }} -p:RaskNativeHeads=true
          fi

  # On-device native E2E: Appium drives the REAL Native + Local app (samples/Rask.Example.Native) on an
  # Android emulator, switches into its WebView, and asserts the showcase rendered with its scoped CSS +
  # Bootstrap (served through NativeOriginAssets) — the device-level replacement for the removed headless
  # shim. Runs on Ubuntu + KVM (GitHub's reliable path for the Android emulator; the macOS runners time out
  # booting it). -p:RaskNativeHeads=android builds ONLY the Android head, so the APK builds on Linux with no
  # iOS workload. The iOS variant (XCUITest + simulator on macOS) runs nightly in native-ios-e2e.yml.
  native-appium:
    runs-on: ubuntu-latest
    # A hung emulator teardown can otherwise stall the job for the 6h default; fail fast instead.
    timeout-minutes: 35
    # The emulator-runner runs each `script` line in a SEPARATE `sh -c`, so shell vars/exports don't
    # persist across lines. Pass the test's env at the job/step level (process env) instead, so it reaches
    # `dotnet test` — otherwise the test silently SKIPS (Skip.IfNot) and the job is a false pass.
    env:
      RASK_APPIUM_SERVER: http://127.0.0.1:4723
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the debug-signed x86_64 showcase APK
        # Debug is signed with the debug keystore (installable) and its WebView is inspectable, so Appium can
        # attach to the WEBVIEW context. android-x64 matches the Ubuntu x86_64 emulator; EmbedAssembliesIntoApk
        # is required because a standalone `adb install` (what Appium does) otherwise launches without Fast
        # Deployment's synced assemblies. RaskNativeHeads=android builds only Rask.Native's Android head.
        run: >-
          dotnet build samples/Rask.Example.Native/Rask.Example.Native.csproj
          -c Debug -f net10.0-android -p:RaskNativeHeads=android
          -p:RuntimeIdentifier=android-x64 -p:EmbedAssembliesIntoApk=true

      - name: Resolve the built APK path for the test
        # Publish the absolute APK path to the job env so it survives into the emulator-runner's script
        # (which can't build up shell vars across its line-per-shell execution).
        run: |
          APK=$(find "$PWD/samples/Rask.Example.Native/bin/Debug/net10.0-android/android-x64" -name '*-Signed.apk' | head -1)
          test -n "$APK" || { echo "No -Signed.apk found"; exit 1; }
          echo "Resolved APK: $APK"
          echo "RASK_APPIUM_ANDROID_APP=$APK" >> "$GITHUB_ENV"

      - name: Run the Appium showcase E2E on the emulator
        # The emulator-runner's own teardown (adb emu kill) hangs on recent emulator images (the gRPC
        # "stop: Not implemented" quirk) AFTER the test has already passed — CONFIRMED unavoidable here: even
        # hard-killing qemu + crashpad_handler below doesn't stop the action's teardown from hanging. So the
        # job's verdict is decoupled from teardown: the test writes an "appium-passed" marker on success, this
        # step is continue-on-error with its own timeout (so the hung teardown fails only the STEP, not the
        # job), and the next step passes/fails purely on the marker. The timeout is the ceiling on wasted
        # hang time: build+boot+test finishes in ~5 min, so 15 comfortably covers a cold boot while cutting
        # the idle teardown tail (the previous 22 burned ~19 idle min after a green test).
        id: appium-e2e
        continue-on-error: true
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # Each line runs in its own shell — keep independent commands only. RASK_APPIUM_SERVER (job env) and
          # RASK_APPIUM_ANDROID_APP ($GITHUB_ENV from the previous step) reach `dotnet test` via the process
          # environment, so no shell vars need to cross lines here.
          script: |
            test -n "$RASK_APPIUM_ANDROID_APP" || { echo "RASK_APPIUM_ANDROID_APP not in env — test would skip"; exit 1; }
            npm install -g appium
            appium driver install uiautomator2
            appium --allow-insecure=uiautomator2:chromedriver_autodownload --log appium.log &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status && break || sleep 2; done
            dotnet test tests/Rask.Native.Appium.Tests/Rask.Native.Appium.Tests.csproj --filter "FullyQualifiedName~Android" --logger "console;verbosity=normal" && touch "$GITHUB_WORKSPACE/appium-passed"
            # Best-effort fast teardown so the action's hang-prone adb-emu-kill finds the emulator already gone.
            # Kill by EXACT process name via killall — NOT `pkill -f qemu-system`, whose own `sh -c pkill …
            # qemu-system` command line matches the pattern, so it kills its own shell (exit code null) and
            # leaves the emulator alive. killall matches argv[0], never itself. crashpad_handler is the
            # emulator's crash reporter; leaving it alive is what keeps the action hanging per upstream
            # issues #385/#381, so kill it too.
            killall -9 qemu-system-x86_64 crashpad_handler 2>/dev/null || true

      - name: Assert the on-device Appium E2E passed
        # The single source of truth for this job: the marker the test writes only when it passes. Immune to
        # the emulator-runner teardown hang (which merely fails the continue-on-error step above).
        run: |
          test -f appium-passed || { echo "On-device Appium E2E did not pass (the test failed, or the emulator step timed out before the test ran)."; exit 1; }
          echo "On-device Appium E2E passed."

      - name: Upload Appium log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: appium-log
          path: appium.log
