name: ci

# Every gate that used to run in a git hook, run here instead, AFTER the push. Nothing in this
# workflow blocks a commit or a push: own work lands on main directly and this says, a few minutes
# later, whether it should have. A red main is fixed forward.
#
# A push to main or a ci/** branch and a pull request are SCOPED: they run the gates the change can
# reach, measured from the newest commit this workflow or full.yml passed that the push descends from
# (scripts/lib/green_base.sh finds it, scripts/lib/affected_gates.py decides, and refuses to narrow
# whatever it cannot reason about — a change to the CI itself, a gate script, the package pins). That is what makes the verdict take minutes.
# What it buys it with: a break a scoped run cannot see is found by the next whole run instead —
# full.yml, on a schedule — which is why nightly.yml and pages.yml publish from THAT run, not this one.
#
# A ci/** branch runs the push set without landing anything, scoped like main: push there to try a
# change first. (It ran the whole set until 2026-11-02, and fifteen branches of 26 jobs each held the
# account's twenty runners for hours.) A ci/release/** branch runs the whole set and the release-only
# gates (see gates.yml), which have no key to be scoped by — how to find out before tagging rather than
# from a failed release.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  # By hand, on any ref, and narrowed to the gates worth a runner:
  #   gh workflow run ci.yml --ref <branch> -f set=all -f only='CLI build|deploy'
  workflow_dispatch:
    inputs:
      set:
        description: push | deps | release | all
        type: choice
        options: [push, deps, release, all]
        default: push
      only:
        description: an ERE over gate names (e.g. 'CLI build|unit'); empty runs the whole set
        type: string
        default: ''
      base:
        description: a commit to measure the change from — runs the scoped set a push from there would
        type: string
        default: ''

permissions:
  contents: read

# On main every push gets a run of its own, at once: none waits behind the one before it, and none that
# has started a gate is dropped for a newer one, so a red run names the push that caused it. One still
# waiting for its first gate when a newer push's run starts is cancelled by that run (the base job,
# scripts/lib/cancel_superseded.sh): the newer run's scope holds its change, and it names nothing yet. (One group for the branch kept a
# single run waiting, the newest — a push landed during a run waited that run out, and the ones between
# were never run at all.) The runners are free for a public repository and a scoped run is a few jobs
# of the twenty that may run at once. Anywhere else only the newest push matters.
concurrency:
  # A manual run is its own group too: two of them on one ref ask different questions (`only`), and the
  # second must not cancel the first.
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Where a scoped run measures the change from. Empty means "run the whole set", which is what a
  # ci/release/** branch, a manual run without a base and a Dependabot pull request get.
  base:
    runs-on: ubuntu-26.04
    timeout-minutes: 10   # a minute of git and gh; a hung API call must not hold a runner
    permissions:
      actions: write   # the last green run; cancel the runs this push supersedes
      contents: read
    outputs:
      scope: ${{ steps.find.outputs.scope }}
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # is the green commit an ancestor of this one?

      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          ASKED_BASE: ${{ inputs.base }}
        run: |
          sha=""
          if [ "$EVENT" = "pull_request" ] && [ "$ACTOR" != "dependabot[bot]" ]; then
            sha="$PR_BASE"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            sha="$ASKED_BASE"
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/main" ]; then
            # The newest green commit of the two workflows that can call main green. Only a PUSH run of
            # this one counts: a manual run may have been narrowed to a single gate.
            sha="$(scripts/lib/green_base.sh "ci.yml/runs?branch=main&event=push" "full.yml/runs?branch=main")"
          elif [ "$EVENT" = "push" ] && [[ "$REF" != refs/heads/ci/release/* ]]; then
            # A ci/** branch: main's green commits it contains, or its own last green push.
            branch="$(jq -rn --arg ref "${REF#refs/heads/}" '$ref | @uri')"
            sha="$(scripts/lib/green_base.sh "ci.yml/runs?branch=main&event=push" "full.yml/runs?branch=main" \
              "ci.yml/runs?branch=$branch&event=push")"
          fi

          if [ -n "$sha" ]; then
            echo "base: scoped, measured from $sha"
            echo "scope=affected" >> "$GITHUB_OUTPUT"
          else
            echo "base: the whole set"
            echo "scope=full" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The older main runs still waiting for their first gate: this push's run holds their change.
      - name: Cancel what this push supersedes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true   # best effort: a run that slips through just runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/lib/cancel_superseded.sh "$GITHUB_RUN_ID"

  gates:
    needs: base
    uses: ./.github/workflows/gates.yml
    with:
      # A Dependabot pull request gets the short set, unscoped: it changes the package pins, which
      # nothing can narrow, and several arrive at once on the runners main is waiting for. One that
      # changes a front-end template's client also gets that template's "front end" job (gates.yml).
      set: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.set
            || startsWith(github.ref, 'refs/heads/ci/release/') && 'all'
            || (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') && 'deps'
            || 'push' }}
      only: ${{ inputs.only }}
      scope: ${{ needs.base.outputs.scope }}
      base: ${{ needs.base.outputs.sha }}
