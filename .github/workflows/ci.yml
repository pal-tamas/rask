name: ci

# Every gate that used to run in a git hook, run here instead, AFTER the push. Nothing in this
# workflow blocks a commit or a push: own work lands on main directly and this says, a few minutes
# later, whether it should have. A red main is fixed forward, and it stops at the door — nightly.yml
# and pages.yml publish only from a commit this workflow passed.
#
# A ci/** branch runs the same gates without landing anything: push there to try a risky change
# first. A ci/release/** branch also runs the release-only gates (see gates.yml), which is how to
# find out before tagging rather than from a failed release.
on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  # By hand, on any ref, and narrowed to the gates worth a runner:
  #   gh workflow run ci.yml --ref <branch> -f set=all -f only='CLI build|deploy'
  workflow_dispatch:
    inputs:
      set:
        description: push | deps | release | all
        type: choice
        options: [push, deps, release, all]
        default: push
      only:
        description: an ERE over gate names (e.g. 'CLI build|unit'); empty runs the whole set
        type: string
        default: ''

permissions:
  contents: read

# On main a push never cancels the run in progress, so a red run names the push that caused it and a
# green one gets to publish. (GitHub keeps one run waiting behind it: the newest.) Anywhere else only
# the newest push matters.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    uses: ./.github/workflows/gates.yml
    with:
      # A Dependabot pull request gets the short set. Each of its runs is a full round of jobs on the same
      # runners main is waiting for, several of them arrive at once, and the browser suites run on main
      # the moment it is merged.
      set: >-
        ${{ github.event_name == 'workflow_dispatch' && inputs.set
            || startsWith(github.ref, 'refs/heads/ci/release/') && 'all'
            || (github.event_name == 'pull_request' && github.actor == 'dependabot[bot]') && 'deps'
            || 'push' }}
      only: ${{ inputs.only }}
