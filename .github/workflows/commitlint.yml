name: commitlint

# Enforce Conventional Commits on PRs (commit messages + PR title).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint PR commits
        uses: wagoid/commitlint-github-action@v6
        with:
          # Must name the file that exists. The action does `existsSync(configFile)` and, when it
          # is false, silently falls back to @commitlint/config-conventional with NO error — so a
          # rename here that misses the workflow leaves a green gate enforcing defaults instead of
          # this repo's rules. CommitlintConfigTests pins the two together.
          configFile: commitlint.config.ts
