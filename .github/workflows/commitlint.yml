name: commitlint

# Enforce Conventional Commits on PRs (commit messages + PR title).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The repository's own rule, scripts/lib/conventional-commit.sh — the type list and the header
      # limit live there and nowhere else, and .githooks/commit-msg calls the same function. No Node:
      # this replaced commitlint's own GitHub action, and nothing here builds or lints with Node.
      #
      # The PR TITLE is checked as well as every commit: a squash merge makes the title the header of
      # the commit that lands on main.
      - name: Lint PR commits
        env:
          # Via env, not ${{ }} interpolation into the script: the title is attacker-controlled text.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          . scripts/lib/conventional-commit.sh

          failed=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            header="$(git log -1 --format=%s "$sha")"
            if ! problem="$(rask_commit_header_error "$header")"; then
              echo "::error::commit $(git log -1 --format=%h "$sha") '$header': $(printf '%s' "$problem" | tr '\n' ' ')"
              failed=1
            fi
          done

          if ! problem="$(rask_commit_header_error "$PR_TITLE")"; then
            echo "::error::the pull request title '$PR_TITLE': $(printf '%s' "$problem" | tr '\n' ' ')"
            failed=1
          fi

          [ "$failed" -eq 0 ] || exit 1
          echo "Conventional: $(git rev-list --count "$BASE_SHA..$HEAD_SHA") commit(s) and the title."

      # The attribution guard, at the one boundary the local hooks cannot cover.
      #
      # .githooks/commit-msg and .githooks/pre-push both check this, but both are hooks: they only run
      # once someone has set core.hooksPath, and a fresh clone has not. That is how two AI trailers
      # reached main and put two extra accounts on GitHub's contributor list, which credits
      # Co-authored-by as well as authors — removing them cost a rewrite of all 970 commits.
      #
      # The PR BODY is checked too, and is the more important half here: a squash merge builds the
      # commit message from the PR title and description, so a trailer pasted into the description
      # lands on main having passed no hook at all.
      #
      # Same predicate as the hooks (scripts/lib/attribution.sh) — one regex, three callers.
      - name: Reject attribution trailers
        env:
          # Via env, not ${{ }} interpolation into the script: the body is attacker-controlled text.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          # Who OPENED the pull request — not github.actor, which is whoever last re-ran the job.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          . scripts/lib/attribution.sh

          failed=0

          # Dependabot signs off every commit it authors and cannot be told not to, so on its own
          # pull requests that one line is dropped before the check. Everything else still counts,
          # and the hooks still reject the sign-off when the bump is landed locally.
          commit_message() {
            if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
              git log -1 --format=%B "$1" | rask_without_dependabot_signoff
            else
              git log -1 --format=%B "$1"
            fi
          }

          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if commit_message "$sha" | rask_message_has_attribution; then
              echo "::error::commit $(git log -1 --format='%h %s' "$sha") carries an attribution trailer"
              failed=1
            fi
          done

          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | rask_message_has_attribution; then
            echo "::error::the pull request title/description carries an attribution trailer — a squash merge would copy it onto main"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo
            echo "This repository credits a single contributor. GitHub counts Co-authored-by trailers"
            echo "toward the contributor list, so these add an account that only a history rewrite removes."
            echo "Delete the line(s); see CONTRIBUTING.md. Install the local guard with:"
            echo "    git config core.hooksPath .githooks"
            exit 1
          fi

          echo "No attribution trailers in $(git rev-list --count "$BASE_SHA..$HEAD_SHA") commit(s), the title, or the body."
