name: Setup .NET for Rask
description: >-
  Installs the .NET SDK and (optionally) the requested workloads with caching, plus the NuGet,
  native-tool and Playwright caches. One place for every workflow's setup so the three CI workflows can't drift.
  Run it AFTER actions/checkout (this action's file has to be on disk first).

inputs:
  workloads:
    description: >-
      Space-separated workloads to install (e.g. "wasm-tools"). Empty installs none —
      pass it only for jobs that actually build/evaluate a project graph needing the workload.
    required: false
    default: ''
  nuget-cache:
    description: >-
      Cache ~/.nuget/packages (saved by main's runs, restored everywhere). Turn off for jobs that never
      restore (e.g. VSTest-direct shards).
    required: false
    default: 'true'
  native-tools:
    description: >-
      Cache the native tools the build fetches (~/.rask: Tailwind, tsgo/esbuild, litestream; ~/.cache/rask:
      Rask.Pdf's Chrome shell), each keyed on its pins. Turn off only for a job that never builds.
    required: false
    default: 'true'
  playwright:
    description: Cache ~/.cache/ms-playwright (the browser-journey shards).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The band global.json pins (11.0.x, rollForward latestFeature): the build runs on a .NET 11 SDK everywhere.
    #
    # Installed into a runner-owned directory, not the image's /usr/share/dotnet: that one is root's, so
    # the workload cache below could be saved from it but never restored into it — tar failed on every
    # chmod, the restore was abandoned with a warning, and each job reinstalled the workload from scratch.
    - uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 11.0.x

    # Keyed on the versions, not the project files: with central package management every version is in
    # Directory.Packages.props, and a key over **/*.csproj saved a new 1.8 GB copy for every project edit.
    #
    # SAVED ON MAIN ONLY, this cache and the tool caches below. Every other ref reads main's copy (a branch may
    # read its default branch's caches) and keeps its own restore to itself: each ci/** branch used to save a
    # copy of its own, five of them filled the repository's 10 GB, and GitHub then evicted the workload and
    # Playwright caches every job reads. So each is a pair, actions/cache on main and actions/cache/restore
    # elsewhere, written out with literal values: the runner does not hand a NESTED composite action's inputs
    # to actions/cache's post step, which then saved nothing ("Input required and not supplied: path").
    - name: Cache NuGet packages
      if: inputs.nuget-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
        restore-keys: nuget-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore NuGet packages from main
      if: inputs.nuget-cache == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
        restore-keys: nuget-v2-${{ runner.os }}-${{ runner.arch }}-

    # The native tools the build fetches itself (docs/deployment.md, "Caching the build's tools in CI"), so a
    # warm runner never asks github.com, npm or Chrome for Testing for one: a release host's outage (504s for
    # longer than the fetch's 90 s of retries, 2026-11-09) went red on every job that built Tailwind (#1314).
    #
    # ONE CACHE PER TOOL, each keyed on the files that pin it — its version AND its digests, as the followers
    # in scripts/upstream/ write them — so a bump is a new key and the build fetches (and checks) the new pin.
    # Not one cache for all four: the first job to save would decide what the cache holds, and most jobs
    # fetch only some of them (Chrome only where a Rask.Pdf app builds). A job that never fetched a tool
    # just finds nothing to save for it. No fallback to an older key either: every root keeps one folder per
    # version, so a restored older copy would carry each superseded pin forever.
    #
    # Saved on main only (above), after main's build fetched the file and checked its pinned SHA-256: a hit is then
    # trusted on the cache's own "already here" check (a Tailwind size receipt, Pdf's .verified marker, an
    # unpacked tsgo/esbuild/litestream), so nothing but main's own verified fetch may write one.
    - name: Cache the Tailwind CLI
      if: inputs.native-tools == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ~/.rask/tailwind
        key: rask-tailwind-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.Tailwind/build/Rask.Tailwind.props', 'src/Rask.Tailwind.Tasks/TailwindPins.cs') }}

    - name: Restore the Tailwind CLI from main
      if: inputs.native-tools == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ~/.rask/tailwind
        key: rask-tailwind-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.Tailwind/build/Rask.Tailwind.props', 'src/Rask.Tailwind.Tasks/TailwindPins.cs') }}

    - name: Cache tsgo and esbuild
      if: inputs.native-tools == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ~/.rask/typescript
        # The versions are in Rask.Core.targets, every digest (keyed "<package>@<version>") in the pin table.
        key: rask-typescript-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.TypeScript.Tasks/TypeScriptToolPins.cs') }}

    - name: Restore tsgo and esbuild from main
      if: inputs.native-tools == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ~/.rask/typescript
        # The versions are in Rask.Core.targets, every digest (keyed "<package>@<version>") in the pin table.
        key: rask-typescript-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.TypeScript.Tasks/TypeScriptToolPins.cs') }}

    - name: Cache litestream
      if: inputs.native-tools == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ~/.rask/litestream
        key: rask-litestream-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.SQLite.Litestream/build/Rask.SQLite.Litestream.props', 'src/Rask.SQLite.Litestream/build/Rask.SQLite.Litestream.targets') }}

    - name: Restore litestream from main
      if: inputs.native-tools == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ~/.rask/litestream
        key: rask-litestream-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.SQLite.Litestream/build/Rask.SQLite.Litestream.props', 'src/Rask.SQLite.Litestream/build/Rask.SQLite.Litestream.targets') }}

    - name: Cache Rask.Pdf's Chrome shell
      if: inputs.native-tools == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ~/.cache/rask
        key: rask-chrome-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.Pdf/build/Rask.Pdf.ChromePin.props') }}

    - name: Restore Rask.Pdf's Chrome shell from main
      if: inputs.native-tools == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/rask
        key: rask-chrome-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/Rask.Pdf/build/Rask.Pdf.ChromePin.props') }}

    # Resolve the SDK version so the workload cache invalidates when the SDK moves (workload packs are
    # SDK-band-specific). Only needed when we install workloads.
    - name: Resolve SDK version
      if: inputs.workloads != ''
      id: sdk
      shell: bash
      run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

    # Cache the workload packs under the SDK root so the install below is a fast unpack rather than a
    # multi-minute download. actions/cache save/restore are non-fatal, so a cold cache
    # simply falls back to a full install — the job never fails on it.
    - name: Cache .NET workloads
      if: inputs.workloads != ''
      uses: actions/cache@v6
      with:
        path: |
          ${{ env.DOTNET_ROOT }}/sdk-manifests
          ${{ env.DOTNET_ROOT }}/packs
          ${{ env.DOTNET_ROOT }}/metadata
          ${{ env.DOTNET_ROOT }}/library-packs
          ${{ env.DOTNET_ROOT }}/template-packs
        key: workloads-v2-${{ runner.os }}-${{ steps.sdk.outputs.version }}-${{ inputs.workloads }}-${{ hashFiles('Directory.Packages.props') }}
        restore-keys: |
          workloads-v2-${{ runner.os }}-${{ steps.sdk.outputs.version }}-${{ inputs.workloads }}-
          workloads-v2-${{ runner.os }}-${{ steps.sdk.outputs.version }}-

    - name: Install workloads
      if: inputs.workloads != ''
      shell: bash
      # --skip-manifest-update: don't re-resolve the advertising manifests on a warm cache (the slow part).
      run: dotnet workload install ${{ inputs.workloads }} --skip-manifest-update

    # The browsers are the ones Microsoft.Playwright asks for (scripts/lib/playwright.sh), and its version is
    # in Directory.Packages.props — the E2E project file names no version, so a key over it kept a stale
    # browser set that every job then downloaded the new one on top of, and never saved. The image is in the
    # key too: Playwright picks its builds by the distribution it runs on.
    - name: Resolve the Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: |
        version="$(sed -n 's/.*Include="Microsoft.Playwright" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)"
        echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"   # the runner's; the env context does not carry it

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-v2-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
