name: Setup .NET for Rask
description: >-
  Installs the .NET SDK and (optionally) the requested workloads with caching, plus the NuGet and
  Playwright caches. One place for every workflow's setup so the three CI workflows can't drift.
  Run it AFTER actions/checkout (this action's file has to be on disk first).

inputs:
  workloads:
    description: >-
      Space-separated workloads to install (e.g. "wasm-tools"). Empty installs none —
      pass it only for jobs that actually build/evaluate a project graph needing the workload.
    required: false
    default: ''
  nuget-cache:
    description: >-
      Cache ~/.nuget/packages (saved by main's runs, restored everywhere). Turn off for jobs that never
      restore (e.g. VSTest-direct shards).
    required: false
    default: 'true'
  playwright:
    description: Cache ~/.cache/ms-playwright (the browser-journey shards).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The band global.json pins (11.0.x, rollForward latestFeature): the build runs on a .NET 11 SDK everywhere.
    #
    # Installed into a runner-owned directory, not the image's /usr/share/dotnet: that one is root's, so
    # the workload cache below could be saved from it but never restored into it — tar failed on every
    # chmod, the restore was abandoned with a warning, and each job reinstalled the workload from scratch.
    - uses: actions/setup-dotnet@v6
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 11.0.x

    # Keyed on the versions, not the project files: with central package management every version is in
    # Directory.Packages.props, and a key over **/*.csproj saved a new 1.8 GB copy for every project edit.
    # SAVED ON MAIN ONLY. Every other ref reads main's copy (a branch may read its default branch's caches)
    # and keeps its own restore to itself: each ci/** branch used to save a copy of its own, five of them
    # filled the repository's 10 GB, and GitHub then evicted the workload and Playwright caches every job reads.
    - name: Cache NuGet packages
      if: inputs.nuget-cache == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
        restore-keys: nuget-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Restore NuGet packages from main
      if: inputs.nuget-cache == 'true' && github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v6
      with:
        path: ~/.nuget/packages
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', 'global.json') }}
        restore-keys: nuget-v2-${{ runner.os }}-${{ runner.arch }}-

    # Resolve the SDK version so the workload cache invalidates when the SDK moves (workload packs are
    # SDK-band-specific). Only needed when we install workloads.
    - name: Resolve SDK version
      if: inputs.workloads != ''
      id: sdk
      shell: bash
      run: echo "version=$(dotnet --version)" >> "$GITHUB_OUTPUT"

    # Cache the workload packs under the SDK root so the install below is a fast unpack rather than a
    # multi-minute download. actions/cache save/restore are non-fatal, so a cold cache
    # simply falls back to a full install — the job never fails on it.
    - name: Cache .NET workloads
      if: inputs.workloads != ''
      uses: actions/cache@v6
      with:
        path: |
          ${{ env.DOTNET_ROOT }}/sdk-manifests
          ${{ env.DOTNET_ROOT }}/packs
          ${{ env.DOTNET_ROOT }}/metadata
          ${{ env.DOTNET_ROOT }}/library-packs
          ${{ env.DOTNET_ROOT }}/template-packs
        key: workloads-v2-${{ runner.os }}-${{ steps.sdk.outputs.version }}-${{ inputs.workloads }}-${{ hashFiles('Directory.Packages.props') }}
        restore-keys: |
          workloads-v2-${{ runner.os }}-${{ steps.sdk.outputs.version }}-${{ inputs.workloads }}-
          workloads-v2-${{ runner.os }}-${{ steps.sdk.outputs.version }}-

    - name: Install workloads
      if: inputs.workloads != ''
      shell: bash
      # --skip-manifest-update: don't re-resolve the advertising manifests on a warm cache (the slow part).
      run: dotnet workload install ${{ inputs.workloads }} --skip-manifest-update

    # The browsers are the ones Microsoft.Playwright asks for (scripts/lib/playwright.sh), and its version is
    # in Directory.Packages.props — the E2E project file names no version, so a key over it kept a stale
    # browser set that every job then downloaded the new one on top of, and never saved. The image is in the
    # key too: Playwright picks its builds by the distribution it runs on.
    - name: Resolve the Playwright version
      if: inputs.playwright == 'true'
      id: playwright
      shell: bash
      run: |
        version="$(sed -n 's/.*Include="Microsoft.Playwright" Version="\([^"]*\)".*/\1/p' Directory.Packages.props)"
        echo "version=${version:-unknown}" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"   # the runner's; the env context does not carry it

    - name: Cache Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-v2-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
