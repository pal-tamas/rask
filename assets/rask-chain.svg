<svg class="rc-svg" role="img" viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg"><title>Chaining onto Div in an editor, with each step&#x27;s doc comment</title><desc>An editor shows Div.Class(&quot;card&quot;)[. A completion list offers Class, Style, OnClick and Id; as each is highlighted its XML doc summary appears beside it, and the same summary lands on the generated factory parameter below.</desc><style>.rc-win { fill: var(--panel, #14141f); }
.rc-bar { fill: var(--panel-2, #1b1b2a); }
.rc-edge { fill: none; stroke: var(--line, rgba(139, 92, 246, 0.28)); stroke-width: 1; }
.rc-rule { stroke: var(--line, rgba(139, 92, 246, 0.28)); stroke-width: 1; }
.rc-dot { fill: var(--muted, #8a8aa4); opacity: 0.45; }
.rc-t {
  font-family: var(--mono, "SFMono-Regular", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace);
  font-size: 21px;
  fill: var(--ink, #e9e9f2);
}
.rc-sm { font-size: 15px; }
.rc-xs { font-size: 13px; }
.rc-mut { fill: var(--muted, #8a8aa4); }
.rc-soft { fill: var(--ink-soft, #c3c2d6); }
.rc-acc { fill: var(--accent, #8b5cf6); }
.rc-str { fill: var(--signal, #34d399); }
.rc-chip { fill: var(--accent, #8b5cf6); opacity: 0.35; }
/* fill-opacity, not opacity: the same element carries .rc-hl, whose `opacity` the keyframes drive.
   Two `opacity` declarations would have the animation's win and paint a solid block over the row;
   fill-opacity is a separate channel and multiplies with it instead. */
.rc-hl-bar { fill: var(--accent, #8b5cf6); fill-opacity: 0.18; }

/* Base state == the final frame, so `animation: none` under reduced motion lands on the payoff. */
.rc-code { opacity: 1; }
.rc-caret { fill: var(--accent, #8b5cf6); opacity: 1; }
.rc-pop { opacity: 1; }
.rc-hl { opacity: 1; transform: translateY(126px); }
.rc-d1, .rc-d2, .rc-d3 { opacity: 0; }
.rc-d4 { opacity: 1; }
.rc-fac { opacity: 1; }

@keyframes rc-code { 0% { opacity: 0; } 5%, 100% { opacity: 1; } }
@keyframes rc-caret { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes rc-pop {
  0%, 7% { opacity: 0; transform: translateY(-8px); }
  12%, 100% { opacity: 1; transform: none; }
}
@keyframes rc-hl {
  0%, 10% { opacity: 0; transform: translateY(0); }
  14%, 24% { opacity: 1; transform: translateY(0); }
  30%, 42% { opacity: 1; transform: translateY(42px); }
  48%, 60% { opacity: 1; transform: translateY(84px); }
  66%, 100% { opacity: 1; transform: translateY(126px); }
}
@keyframes rc-d1 { 0%, 12% { opacity: 0; } 16%, 24% { opacity: 1; } 30%, 100% { opacity: 0; } }
@keyframes rc-d2 { 0%, 28% { opacity: 0; } 32%, 42% { opacity: 1; } 48%, 100% { opacity: 0; } }
@keyframes rc-d3 { 0%, 46% { opacity: 0; } 50%, 60% { opacity: 1; } 66%, 100% { opacity: 0; } }
@keyframes rc-d4 { 0%, 64% { opacity: 0; } 68%, 100% { opacity: 1; } }
@keyframes rc-fac { 0%, 74% { opacity: 0; } 80%, 100% { opacity: 1; } }

.rc-code { animation: rc-code 11s infinite; }
.rc-caret { animation: rc-caret 1.1s steps(1, end) infinite; }
.rc-pop { animation: rc-pop 11s infinite; }
.rc-hl { animation: rc-hl 11s infinite; }
.rc-d1 { animation: rc-d1 11s infinite; }
.rc-d2 { animation: rc-d2 11s infinite; }
.rc-d3 { animation: rc-d3 11s infinite; }
.rc-d4 { animation: rc-d4 11s infinite; }
.rc-fac { animation: rc-fac 11s infinite; }

@media (prefers-reduced-motion: reduce) {
  .rc-code, .rc-caret, .rc-pop, .rc-hl,
  .rc-d1, .rc-d2, .rc-d3, .rc-d4, .rc-fac { animation: none; }
}</style><g><rect class="rc-win" x="0.5" y="0.5" width="879" height="399" rx="16"></rect><rect class="rc-bar" x="0.5" y="0.5" width="879" height="44" rx="16"></rect><rect class="rc-bar" x="0.5" y="28" width="879" height="17"></rect><line class="rc-rule" x1="0" y1="44.5" x2="880" y2="44.5"></line><rect class="rc-edge" x="0.5" y="0.5" width="879" height="399" rx="16"></rect><circle class="rc-dot" cx="28" cy="22" r="5"></circle><circle class="rc-dot" cx="48" cy="22" r="5"></circle><circle class="rc-dot" cx="68" cy="22" r="5"></circle><text class="rc-t rc-xs rc-mut" x="92" y="27">ProductCard.cs</text></g><g class="rc-code"><text class="rc-t" x="44" y="96"><tspan class="rc-acc">Div</tspan><tspan>.Class</tspan><tspan class="rc-mut">(</tspan><tspan class="rc-str">&quot;card&quot;</tspan><tspan class="rc-mut">)[</tspan></text><rect class="rc-caret" x="94" y="78" width="2" height="24"></rect></g><g class="rc-pop"><rect class="rc-bar" x="88" y="124" width="300" height="188" rx="12"></rect><rect class="rc-edge" x="88" y="124" width="300" height="188" rx="12"></rect><rect class="rc-hl-bar rc-hl" x="94" y="136" width="288" height="38" rx="8"></rect><g><rect class="rc-chip" x="106" y="148" width="14" height="14" rx="4"></rect><text class="rc-t rc-sm" x="132" y="161">Class</text><text class="rc-t rc-xs rc-mut" x="372" y="161" text-anchor="end">string?</text></g><g><rect class="rc-chip" x="106" y="190" width="14" height="14" rx="4"></rect><text class="rc-t rc-sm" x="132" y="203">Style</text><text class="rc-t rc-xs rc-mut" x="372" y="203" text-anchor="end">string?</text></g><g><rect class="rc-chip" x="106" y="232" width="14" height="14" rx="4"></rect><text class="rc-t rc-sm" x="132" y="245">OnClick</text><text class="rc-t rc-xs rc-mut" x="372" y="245" text-anchor="end">Action?</text></g><g><rect class="rc-chip" x="106" y="274" width="14" height="14" rx="4"></rect><text class="rc-t rc-sm" x="132" y="287">Id</text><text class="rc-t rc-xs rc-mut" x="372" y="287" text-anchor="end">string?</text></g></g><g><rect class="rc-bar" x="412" y="124" width="432" height="188" rx="12"></rect><rect class="rc-edge" x="412" y="124" width="432" height="188" rx="12"></rect><g class="rc-d1"><text class="rc-t rc-sm rc-acc" x="436" y="158">string? Class</text><text class="rc-t rc-xs rc-mut" x="436" y="190">/// &lt;summary&gt;</text><text class="rc-t rc-sm rc-soft" x="436" y="218">The global class attribute &#x2014; a space-separated</text><text class="rc-t rc-sm rc-soft" x="436" y="242">list of class names, the usual hook for CSS</text><text class="rc-t rc-sm rc-soft" x="436" y="266">and for finding an element from script.</text><text class="rc-t rc-xs rc-mut" x="436" y="292">/// &lt;/summary&gt;</text></g><g class="rc-d2"><text class="rc-t rc-sm rc-acc" x="436" y="158">string? Style</text><text class="rc-t rc-xs rc-mut" x="436" y="190">/// &lt;summary&gt;</text><text class="rc-t rc-sm rc-soft" x="436" y="218">The global style attribute &#x2014; CSS declarations</text><text class="rc-t rc-sm rc-soft" x="436" y="242">applied to this element alone.</text><text class="rc-t rc-sm rc-soft" x="436" y="266"></text><text class="rc-t rc-xs rc-mut" x="436" y="292">/// &lt;/summary&gt;</text></g><g class="rc-d3"><text class="rc-t rc-sm rc-acc" x="436" y="158">Action? OnClick</text><text class="rc-t rc-xs rc-mut" x="436" y="190">/// &lt;summary&gt;</text><text class="rc-t rc-sm rc-soft" x="436" y="218">Click. Parameterless (modifier/coordinate-free)</text><text class="rc-t rc-sm rc-soft" x="436" y="242">for source compatibility &#x2014; use the mouse</text><text class="rc-t rc-sm rc-soft" x="436" y="266">events below for geometry.</text><text class="rc-t rc-xs rc-mut" x="436" y="292">/// &lt;/summary&gt;</text></g><g class="rc-d4"><text class="rc-t rc-sm rc-acc" x="436" y="158">string? Id</text><text class="rc-t rc-xs rc-mut" x="436" y="190">/// &lt;summary&gt;</text><text class="rc-t rc-sm rc-soft" x="436" y="218">The global id attribute &#x2014; this element&#x27;s</text><text class="rc-t rc-sm rc-soft" x="436" y="242">unique identifier in the document.</text><text class="rc-t rc-sm rc-soft" x="436" y="266"></text><text class="rc-t rc-xs rc-mut" x="436" y="292">/// &lt;/summary&gt;</text></g></g><g class="rc-fac"><line class="rc-rule" x1="36" y1="336.5" x2="844" y2="336.5"></line><text class="rc-t rc-sm" x="44" y="372"><tspan class="rc-mut">Generated.</tspan><tspan class="rc-acc">Div</tspan><tspan class="rc-mut">(</tspan><tspan>class:</tspan><tspan class="rc-str"> &quot;card&quot;</tspan><tspan class="rc-mut">)</tspan></text><text class="rc-t rc-xs rc-mut" x="844" y="372" text-anchor="end">the same summary, on the factory parameter</text></g></svg>
