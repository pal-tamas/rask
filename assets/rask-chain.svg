-t rc-xs rc-mut" x="220" y="496">/// &lt;summary&gt;</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc0-0" x="220" y="510">The global class attribute &#x2014; a space-separated</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc0-1" x="220" y="526">list of class names, the usual hook for CSS</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc0-2" x="220" y="542">and for finding an element from script.</text></g><g class="rc-doc rc-doc1" data-rask-key="doc1"><text class="rc-t rc-xs rc-mut" x="220" y="496">/// &lt;summary&gt;</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc1-0" x="220" y="510">The global id attribute &#x2014; this element&#x27;s</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc1-1" x="220" y="526">unique identifier in the document.</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc1-2" x="220" y="542"></text></g><g class="rc-doc rc-doc2" data-rask-key="doc2"><text class="rc-t rc-xs rc-mut" x="220" y="496">/// &lt;summary&gt;</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc2-0" x="220" y="510">Click. Parameterless (modifier/coordinate-free)</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc2-1" x="220" y="526">for source compatibility &#x2014; use the mouse</text><text class="rc-t rc-xxs rc-soft" data-rask-key="doc2-2" x="220" y="542">events below for geometry.</text></g></g></svg>
