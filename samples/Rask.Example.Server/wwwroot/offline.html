<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Rask Server Showcase</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #faf9fe; color: #1c1c28; text-align: center; padding: 1.5rem;
        }
        @media (prefers-color-scheme: dark) { body { background: #14131c; color: #e8e7f0; } }
        .card { max-width: 28rem; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { color: #6c6a7d; line-height: 1.5; margin: 0 0 1.25rem; }
        button {
            font: inherit; padding: .5rem 1.25rem; border: 0; border-radius: .5rem;
            background: #512BD4; color: #fff; cursor: pointer;
        }
        .mark { width: 56px; height: 56px; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <img class="mark" src="/icon.svg" alt="Rask">
        <h1>You're offline</h1>
        <p>
            This is a Rask <strong>Server</strong> app — its live UI runs over a WebSocket, so it needs a
            connection. Reconnect and you'll pick up right where you left off.
        </p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
