<!--
  Rask.Example.Site — the marketing landing page, built as a Rask WASM app and served at the
  GitHub Pages root.

  This shell is the boot document, and since <RaskPrerender>true</RaskPrerender> it is also the
  TEMPLATE the prerendered page is spliced into: at publish the pass keeps this <head> — the
  fingerprinted import map, the preload, the <base href> — replaces the body below with the rendered
  page, and carries the script at the end over. So what a visitor is served has the real markup AND
  still boots. Keep it minimal; the App component is the source of truth for the page's real <head>.
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!-- <base href> is rewritten to /<prefix>/ by the framework's _RaskRewriteBaseHref target when
         published with -p:RaskPathBase=/<prefix>. This app is served from the origin root, so it is
         published without one and this default is already correct. -->
    <base href="/"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Rask</title>
    <!-- Asset-fingerprinting placeholders filled by Microsoft.NET.Sdk.WebAssembly at publish
         (<OverrideHtmlAssetPlaceholders>true</OverrideHtmlAssetPlaceholders>). -->
    <link rel="preload" id="webassembly"/>
    <script type="importmap"></script>
    <link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect width='128' height='128' rx='28' fill='%237c3aed'/%3E%3Cpath d='M74 24 L38 66 L58 66 L53 104 L92 58 L70 58 Z' fill='%23fff'/%3E%3C/svg%3E"
          rel="icon" type="image/svg+xml"/>
    <style id="rask-scoped"></style>
    <style>
        /*
          The boot screen, on the light ground the page itself uses so there is no flash between the
          two. There is no theme-init script any more: this page has one palette, and the script that
          stamped data-theme existed to serve a dark default and a toggle that are both gone.

          On a published build almost nobody sees this — prerendering replaces the body below with the
          real page — so it is what `dotnet run` shows locally, and the fallback if the pass ever skips
          this route.
        */
        .rask-boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            color: #6d28d9;
            background: #fafafa;
        }

        .rask-boot .rask-spin {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid rgba(124, 58, 237, 0.25);
            border-top-color: #7c3aed;
            animation: rask-spin 0.8s linear infinite;
        }

        .rask-boot__label {
            font-size: 0.8125rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.7;
        }

        @keyframes rask-spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body data-rask-root>
<div class="rask-boot">
    <div class="rask-spin"></div>
    <div class="rask-boot__label">Loading Rask…</div>
</div>
<script src="main.js" type="module"></script>
</body>
</html>
