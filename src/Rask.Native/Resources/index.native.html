<!--
  Rask native boot shell. The platform head serves this into the WebView from a real origin
  (iOS: a WKURLSchemeHandler app:// origin; Android: a WebViewAssetLoader https://appassets/…
  origin) so localStorage / crypto.subtle / other secure-context device APIs work — an opaque
  origin (LoadHtmlString / loadData) would break them.

  Unlike the WASM shell there is NO dotnet.js: the .NET runtime is the host PROCESS, not code in
  the WebView. The page only loads the native client runtime (rask.native.js), which binds DOM
  event listeners and applies the frames the host pushes over the native bridge. The host's
  NativeLiveSession renders the App's real <head> (title, scoped-CSS links) and it morphs in on
  first paint, replacing the boot splash below.
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
    <title>Rask</title>
    <style id="rask-scoped"></style>
    <style>
        html, body { margin: 0; height: 100%; -webkit-tap-highlight-color: transparent; }
        .rask-boot {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 1.25rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #512BD4; background: #faf9fe;
        }
        .rask-boot svg { width: 64px; height: 64px; animation: rask-pulse 1.4s ease-in-out infinite; }
        .rask-spin {
            width: 26px; height: 26px; border-radius: 50%;
            border: 3px solid rgba(124, 58, 237, 0.22); border-top-color: #7C3AED;
            animation: rask-spin 0.8s linear infinite;
        }
        @keyframes rask-spin { to { transform: rotate(360deg); } }
        @keyframes rask-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
</head>
<body data-rask-root="native">
<div class="rask-boot">
    <svg aria-label="Rask" role="img" viewBox="22 6 80 108" xmlns="http://www.w3.org/2000/svg">
        <linearGradient id="rask-boot-bolt" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#7C3AED"/>
            <stop offset="1" stop-color="#512BD4"/>
        </linearGradient>
        <path d="M72 14 L30 64 L54 64 L48 106 L94 54 L68 54 Z" fill="url(#rask-boot-bolt)"/>
    </svg>
    <div class="rask-spin"></div>
</div>
<script src="rask.native.js" type="module"></script>
</body>
</html>
