<!doctype html>
<html lang="en" data-rask-ui>
<head>
    <meta charset="utf-8"/>
    <!--
      The data demo's boot shell. data-rask-ui turns the kit's theme on for the whole document. <base href> is
      rewritten to "/demos/data/" at publish (<RaskPathBase> in the csproj); `dotnet run` keeps "/".
    -->
    <base href="/"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Notes in the browser — a Rask full-stack demo</title>
    <link rel="preload" id="webassembly"/>
    <script type="importmap"></script>
    <style id="rask-scoped"></style>
    <script>
        // Dark mode as rask.sh has it (same origin, same key as Ui.AppearanceScript), before first paint, so
        // the demo in a guide's iframe matches the page around it — and follows it when the reader flips the
        // moon. Nothing stored: follow the OS. Re-applied after every morph, which rewrites <html>.
        (function () {
            var media = window.matchMedia("(prefers-color-scheme: dark)");
            function apply() {
                var stored = null;
                try { stored = localStorage.getItem("rask.appearance"); } catch (e) { }
                var dark = stored === "dark" || (stored !== "light" && media.matches);
                document.documentElement.classList.toggle("dark", dark);
                // Goes with daisyUI, which still draws most of the kit and reads data-theme.
                document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
            }
            apply();
            media.addEventListener("change", apply);
            window.addEventListener("storage", apply);
            var previous = window.raskAfterMorph;
            window.raskAfterMorph = function () {
                apply();
                if (typeof previous === "function") previous();
            };
        })();
    </script>
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; }
        .rask-boot { display: flex; align-items: center; justify-content: center; min-height: 12rem; opacity: .7; }
    </style>
</head>
<body data-rask-root>
<div class="rask-boot">Loading the notes demo…</div>
<script src="main.js" type="module"></script>
</body>
</html>
