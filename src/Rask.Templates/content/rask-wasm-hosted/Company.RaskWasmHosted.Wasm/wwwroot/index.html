<!--
  Default Rask WASM page shell. Served as the SPA entry point under both run
  modes: the standalone `dotnet run` on the browser-wasm project (which boots
  WasmAppHost) and `Rask.Wasm.Hosting`'s `app.UseRask()` (UseDefaultFiles +
  UseStaticFiles + a MapFallback that sends this file). The browser parses
  this HTML, the runtime imports main.js, dotnet boots, and the App's
  rendered HTML morphs onto document.documentElement — so the App's <head>
  (title, stylesheet links, scoped-css link) ends up in the browser's head
  on first paint, replacing the placeholders below.

  Keep this shell minimal. The App component is the source of truth for the
  page's real <head>; this file only has to give the runtime a place to mount.
-->
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <!--
      <base href="/"> forces relative URLs (main.js, _framework/*) to resolve
      from the origin root regardless of the current document path. Without it,
      a deep-link reload at /users/42 would resolve main.js to /users/main.js
      and the WASM bundle never boots. GH Pages deploys rewrite this href to
      /<repo>/ in CI.
    -->
    <base href="/"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Rask WASM</title>
    <!--
      Asset-fingerprinting placeholders (Microsoft.NET.Sdk.WebAssembly +
      <OverrideHtmlAssetPlaceholders>true</OverrideHtmlAssetPlaceholders>). On publish the
      SDK fills this import map with the content-hashed framework asset URLs (and their
      integrity hashes) and schedules the runtime download via the preload link. main.js
      still imports './_framework/dotnet.js' verbatim — the browser resolves it through the
      import map to the fingerprinted file. Content-hashed URLs make redeploys on static
      hosts (GitHub Pages) cache-safe: a new release changes the URLs, so a stale cached
      asset can never fail the runtime's subresource-integrity check.
    -->
    <link rel="preload" id="webassembly"/>
    <script type="importmap"></script>
    <!-- Inline data-URI favicon (the Rask bolt) so the boot screen is branded with no
         external file dependency; the App's <head> morphs in its own <link> on first paint. -->
    <link href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='22 6 80 108'%3E%3ClinearGradient id='b' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C3AED'/%3E%3Cstop offset='1' stop-color='%23512BD4'/%3E%3C/linearGradient%3E%3Cpath d='M72 14 L30 64 L54 64 L48 106 L94 54 L68 54 Z' fill='url(%23b)'/%3E%3C/svg%3E" rel="icon"
          type="image/svg+xml"/>
    <style id="rask-scoped"></style>
    <style>
        .rask-boot {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #512BD4;
            background: #faf9fe;
        }

        .rask-boot svg {
            width: 64px;
            height: 64px;
            animation: rask-pulse 1.4s ease-in-out infinite;
        }

        .rask-boot .rask-spin {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 3px solid rgba(124, 58, 237, 0.22);
            border-top-color: #7C3AED;
            animation: rask-spin 0.8s linear infinite;
        }

        /* Determinate download progress, revealed by main.js once the boot config
           reports a resource count. Stays hidden (spinner-only fallback) when the
           total is unknown. */
        .rask-boot__progress {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .rask-boot__bar {
            width: 180px;
            height: 4px;
            border-radius: 999px;
            background: rgba(124, 58, 237, 0.18);
            overflow: hidden;
        }

        .rask-boot__fill {
            height: 100%;
            width: 0;
            border-radius: inherit;
            background: #7C3AED;
            transition: width 0.2s ease;
        }

        .rask-boot__label {
            font-size: 0.8125rem;
            opacity: 0.72;
            font-variant-numeric: tabular-nums;
        }

        @keyframes rask-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rask-pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.55;
            }
        }
    </style>
</head>
<body data-rask-root>
<div class="rask-boot">
    <svg aria-label="Rask" role="img" viewBox="22 6 80 108" xmlns="http://www.w3.org/2000/svg">
        <linearGradient id="rask-boot-bolt" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#7C3AED"/>
            <stop offset="1" stop-color="#512BD4"/>
        </linearGradient>
        <path d="M72 14 L30 64 L54 64 L48 106 L94 54 L68 54 Z" fill="url(#rask-boot-bolt)"/>
    </svg>
    <div class="rask-spin"></div>
    <div class="rask-boot__progress" hidden>
        <div class="rask-boot__bar">
            <div class="rask-boot__fill"></div>
        </div>
        <div class="rask-boot__label">Loading…</div>
    </div>
</div>
<script src="main.js" type="module"></script>
<!--#if (pwa)-->
<!-- PWA: register Rask's default service worker (offline app-shell cache + Web Push). Resolves
     relative to <base href>, so it works at the origin root and under a sub-path deploy. -->
<script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
            var base = document.querySelector("base");
            var scope = base ? new URL(base.href).pathname : "/";
            navigator.serviceWorker.register(scope + "rask-sw.js").catch(function () { });
        });
    }
</script>
<!--#endif-->
</body>
</html>
