<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CompanyRaskserverClient</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- rask:if pwa -->
    <link href="/manifest.webmanifest" rel="manifest" />
    <meta content="#512BD4" name="theme-color" />
    <script>
      // Registered at the origin root, so the worker controls every route rather than
      // whichever one the user happened to land on. Failures are ignored: a browser
      // without service workers (or a page on plain http) is not a broken app.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/rask-sw.js').catch(() => {})
        })
      }
    </script>
    <!-- rask:end -->
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
